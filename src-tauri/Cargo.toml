[package]
name = "session-loom"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
session-loom-core = { path = "../crates/session-loom-core" }

[dev-dependencies]
tempfile = "3"
