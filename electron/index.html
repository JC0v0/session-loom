<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>session-loom</title>
<link rel="icon" href="../assets/icon.png" />
<style>
  :root {
    --bg: #0A0A0D;
    --bg-soft: #0E0E12;
    --panel: #141419;
    --panel-2: #1B1B22;
    --border: #232329;
    --border-strong: #36363F;
    --text: #F4F4F5;
    --text-dim: #9E9EAA;
    --text-faint: #63636E;
    --accent: #8B5CF6;
    --accent-soft: rgba(139, 92, 246, .13);
    --accent-strong: #A78BFA;
    --ok: #34D399;
    --codex: #7DD3FC;
    --claude: #FDBA74;
    --danger: #F87171;
    --mono: 'Cascadia Code', 'JetBrains Mono', Consolas, 'Courier New', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    display: grid;
    grid-template-rows: 52px 1fr;
    height: 100vh;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.55 -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
    overflow: hidden;
  }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 6px; border: 2px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-track { background: transparent; }

  header {
    display: flex; align-items: center; gap: 14px;
    padding: 0 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 15px; letter-spacing: .2px; }
  .brand .loom { width: 24px; height: 24px; border-radius: 7px; }
  .spacer { flex: 1; }
  .count-pill { color: var(--text-dim); font-size: 12px; }
  .daemon-pill {
    display: flex; align-items: center; gap: 7px;
    padding: 5px 12px; border-radius: 999px;
    border: 1px solid var(--border-strong);
    background: var(--panel-2); color: var(--text-dim);
    font-size: 12px; cursor: pointer; user-select: none;
    transition: border-color .15s, color .15s;
  }
  .daemon-pill:hover { border-color: var(--accent); color: var(--text); }
  .daemon-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: #55555F; }
  .daemon-pill.on .dot { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  .daemon-pill.on { color: var(--text); }

  main { display: grid; grid-template-columns: 350px 1fr; min-height: 0; }

  aside { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--border); background: var(--bg-soft); }
  .side-tools { padding: 12px 12px 8px; display: flex; flex-direction: column; gap: 10px; }
  #search {
    width: 100%; padding: 8px 12px;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    font-size: 13px; outline: none;
  }
  #search:focus { border-color: var(--accent); }
  #search::placeholder { color: var(--text-faint); }
  .tabs { display: flex; gap: 6px; }
  .tab {
    flex: 1; text-align: center; padding: 6px 0;
    border-radius: 7px; border: 1px solid transparent;
    background: transparent; color: var(--text-dim);
    font-size: 12.5px; cursor: pointer;
  }
  .tab:hover { color: var(--text); }
  .tab.active { background: var(--panel-2); color: var(--text); border-color: var(--border-strong); }

  #sessionList { flex: 1; overflow-y: auto; padding: 4px 8px 12px; }
  .card {
    padding: 10px 12px; margin: 6px 2px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; cursor: pointer;
    transition: border-color .12s, background .12s;
  }
  .card:hover { border-color: var(--border-strong); }
  .card.active { border-color: var(--accent); background: var(--accent-soft); }
  .card .title {
    font-size: 13.5px; font-weight: 600;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; word-break: break-word;
  }
  .card .meta { display: flex; align-items: center; gap: 8px; margin-top: 7px; }
  .card .cwd {
    margin-top: 5px; font-family: var(--mono); font-size: 11px; color: var(--text-faint);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .rel { margin-left: auto; font-size: 11px; color: var(--text-dim); white-space: nowrap; }

  .badge {
    display: inline-flex; align-items: center;
    padding: 1.5px 8px; border-radius: 999px;
    font-size: 11px; font-weight: 700; letter-spacing: .3px;
  }
  .badge.codex { color: var(--codex); background: rgba(125,211,252,.08); border: 1px solid rgba(125,211,252,.22); }
  .badge.claude { color: var(--claude); background: rgba(253,186,116,.08); border: 1px solid rgba(253,186,116,.22); }

  #detail { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .detail-head { padding: 16px 20px 14px; border-bottom: 1px solid var(--border); background: var(--panel); }
  .detail-head h1 { font-size: 17px; font-weight: 700; line-height: 1.4; word-break: break-word; }
  .detail-sub { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 8px; color: var(--text-dim); font-size: 12px; }
  .detail-sub .cwd { font-family: var(--mono); font-size: 11.5px; color: var(--text-dim); word-break: break-all; }
  .sid { font-family: var(--mono); font-size: 11px; color: var(--text-faint); cursor: pointer; }
  .sid:hover { color: var(--text-dim); }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

  .btn {
    padding: 7px 14px; border-radius: 8px;
    border: 1px solid var(--border-strong);
    background: var(--panel-2); color: var(--text);
    font-size: 12.5px; font-weight: 600; cursor: pointer;
    transition: filter .12s, border-color .12s;
  }
  .btn:hover { filter: brightness(1.15); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #FFFFFF; }
  .btn.danger { background: transparent; border-color: rgba(239,68,68,.5); color: var(--danger); }
  .btn.danger:hover { background: rgba(239,68,68,.12); }

  #conversation { flex: 1; overflow-y: auto; padding: 18px 22px 30px; }
  .msg { margin: 0 0 14px; padding: 12px 14px; border-radius: 10px; background: var(--panel); border: 1px solid var(--border); border-left-width: 3px; }
  .msg.user { border-left-color: var(--accent); }
  .msg.assistant { border-left-color: var(--border-strong); }
  .msg .role { font-size: 11px; font-weight: 700; letter-spacing: .6px; color: var(--text-dim); margin-bottom: 6px; }
  .msg.user .role { color: var(--accent-strong); }
  .msg .text { white-space: pre-wrap; word-break: break-word; font-size: 13.5px; }
  details.tool { margin-top: 9px; background: #0b1220; border: 1px solid var(--border); border-radius: 8px; }
  details.tool summary {
    cursor: pointer; padding: 7px 11px;
    font-family: var(--mono); font-size: 12px; color: var(--claude);
    list-style: none; user-select: none;
  }
  details.tool summary::before { content: '> '; color: var(--text-dim); }
  details.tool[open] summary::before { content: 'v '; }
  details.tool pre {
    margin: 0 11px 10px; padding: 9px 11px;
    background: var(--bg); border-radius: 6px;
    font-family: var(--mono); font-size: 11.5px; color: var(--text-dim);
    white-space: pre-wrap; word-break: break-word;
    max-height: 280px; overflow-y: auto;
  }

  .empty { flex: 1; display: grid; place-items: center; color: var(--text-faint); font-size: 13px; text-align: center; padding: 40px; }
  .empty .big { font-size: 34px; margin-bottom: 10px; }

  #toast {
    position: fixed; right: 18px; bottom: 18px; z-index: 50;
    max-width: 460px; padding: 11px 15px;
    background: var(--panel); border: 1px solid var(--border-strong);
    border-left: 3px solid var(--accent);
    border-radius: 10px; font-size: 12.5px;
    box-shadow: 0 10px 30px rgba(0,0,0,.45);
    opacity: 0; transform: translateY(8px);
    transition: opacity .18s, transform .18s;
    pointer-events: none; word-break: break-all;
  }
  #toast.show { opacity: 1; transform: translateY(0); }
  #toast.err { border-left-color: var(--danger); }
</style>
</head>
<body>
  <header>
    <div class="brand"><img class="loom" src="../assets/icon.png" alt="" /> session-loom</div>
    <div class="spacer"></div>
    <span class="count-pill" id="countPill"></span>
    <div class="daemon-pill" id="daemonPill" title="点击启动/停止镜像守护进程">
      <span class="dot"></span><span id="daemonText">守护进程</span>
    </div>
  </header>

  <main>
    <aside>
      <div class="side-tools">
        <input id="search" type="search" placeholder="搜索会话内容或目录…" autocomplete="off" />
        <div class="tabs">
          <button class="tab active" data-tool="all">全部</button>
          <button class="tab" data-tool="codex">Codex</button>
          <button class="tab" data-tool="claude">Claude</button>
        </div>
      </div>
      <div id="sessionList"></div>
    </aside>

    <section id="detail">
      <div class="empty" id="emptyState">
        <div>
          <div class="big">&#8646;</div>
          从左侧选择一个会话查看对话内容<br />选中后可将其恢复到 Claude Code 或 Codex 继续对话
        </div>
      </div>
      <div id="detailBody" style="display:none; flex:1; flex-direction:column; min-height:0;"></div>
    </section>
  </main>

  <div id="toast"></div>

<script>
  const api = window.sessionApi;
  const state = { tool: 'all', query: '', sessions: [], selectedId: null, fingerprint: '' };

  const $ = (id) => document.getElementById(id);
  const listEl = $('sessionList');
  const emptyEl = $('emptyState');
  const bodyEl = $('detailBody');

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function relTime(iso) {
    const t = new Date(iso).getTime();
    if (!Number.isFinite(t)) return '';
    const s = Math.max(0, (Date.now() - t) / 1000);
    if (s < 60) return '刚刚';
    if (s < 3600) return Math.floor(s / 60) + ' 分钟前';
    if (s < 86400) return Math.floor(s / 3600) + ' 小时前';
    if (s < 86400 * 30) return Math.floor(s / 86400) + ' 天前';
    return new Date(t).toLocaleDateString();
  }

  function fmtTime(iso) {
    const d = new Date(iso);
    return Number.isFinite(d.getTime()) ? d.toLocaleString() : iso;
  }

  let toastTimer;
  function toast(message, ok = true) {
    const el = $('toast');
    el.textContent = message;
    el.className = 'show' + (ok ? '' : ' err');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.className = ''; }, 5200);
  }

  async function loadSessions(keepScroll = true) {
    const scroll = listEl.scrollTop;
    try {
      const sessions = await api.list({ tool: state.tool === 'all' ? undefined : state.tool, query: state.query });
      state.sessions = sessions;
      $('countPill').textContent = sessions.length + ' 个会话';
      const fp = JSON.stringify(sessions.map((s) => s.sessionId + s.updatedAt));
      if (fp !== state.fingerprint) {
        state.fingerprint = fp;
        renderList();
      }
      if (keepScroll) listEl.scrollTop = scroll;
      if (state.selectedId && !sessions.some((s) => s.sessionId === state.selectedId)) {
        clearDetail();
      }
    } catch (e) {
      toast('加载会话失败: ' + (e.message || e), false);
    }
  }

  function renderList() {
    if (!state.sessions.length) {
      listEl.innerHTML = '<div class="empty" style="padding:30px 10px;">没有匹配的会话</div>';
      return;
    }
    listEl.innerHTML = state.sessions.map((s) => [
      '<div class="card' + (s.sessionId === state.selectedId ? ' active' : '') + '" data-id="' + escapeHtml(s.sessionId) + '">',
      '  <div class="title">' + escapeHtml(s.title) + '</div>',
      '  <div class="meta">',
      '    <span class="badge ' + s.sourceTool + '">' + (s.sourceTool === 'codex' ? 'Codex' : 'Claude') + '</span>',
      '    <span style="font-size:11px;color:var(--text-dim);">' + s.messageCount + ' 条消息</span>',
      '    <span class="rel" title="' + escapeHtml(fmtTime(s.updatedAt)) + '">' + relTime(s.updatedAt) + '</span>',
      '  </div>',
      '  <div class="cwd" title="' + escapeHtml(s.cwd) + '">' + escapeHtml(s.cwd) + '</div>',
      '</div>',
    ].join('\n')).join('\n');
    for (const card of listEl.querySelectorAll('.card')) {
      card.addEventListener('click', () => selectSession(card.dataset.id));
    }
  }

  function clearDetail() {
    state.selectedId = null;
    emptyEl.style.display = 'grid';
    bodyEl.style.display = 'none';
    bodyEl.innerHTML = '';
    renderList();
  }

  async function selectSession(id) {
    state.selectedId = id;
    renderList();
    let session;
    try {
      session = await api.get(id);
    } catch (e) {
      toast('读取会话失败: ' + (e.message || e), false);
      return;
    }
    renderDetail(session);
  }

  function truncate(s, n) {
    s = String(s == null ? '' : s);
    return s.length > n ? s.slice(0, n) + '\n… (截断, 共 ' + s.length + ' 字符)' : s;
  }

  function sessionTitle(session) {
    const firstUser = session.messages.find((m) => m.role === 'user' && m.text && m.text.trim());
    const t = firstUser ? firstUser.text.trim().replace(/\s+/g, ' ') : '(空会话)';
    return t.length > 120 ? t.slice(0, 120) + '…' : t;
  }

  function renderDetail(session) {
    emptyEl.style.display = 'none';
    bodyEl.style.display = 'flex';
    const toolLabel = session.sourceTool === 'codex' ? 'Codex' : 'Claude';
    const otherTool = session.sourceTool === 'codex' ? 'claude' : 'codex';
    const otherLabel = session.sourceTool === 'codex' ? 'Claude' : 'Codex';
    const toolCalls = session.messages.reduce((n, m) => n + ((m.toolCalls && m.toolCalls.length) || 0), 0);
    const title = sessionTitle(session);

    bodyEl.innerHTML = [
      '<div class="detail-head">',
      '  <h1>' + escapeHtml(title) + '</h1>',
      '  <div class="detail-sub">',
      '    <span class="badge ' + session.sourceTool + '">' + toolLabel + '</span>',
      '    <span>' + session.messages.length + ' 条消息 · ' + toolCalls + ' 次工具调用</span>',
      '    <span>更新于 ' + escapeHtml(fmtTime(session.updatedAt)) + '</span>',
      '  </div>',
      '  <div class="detail-sub"><span class="cwd">' + escapeHtml(session.cwd) + '</span></div>',
      '  <div class="detail-sub"><span class="sid" id="sidCopy" title="点击复制会话 ID">' + escapeHtml(session.sessionId) + '</span></div>',
      '  <div class="actions">',
      '    <button class="btn primary" id="btnRestoreCross">恢复到 ' + otherLabel + ' 继续对话</button>',
      '    <button class="btn" id="btnRestoreSame">复制回 ' + toolLabel + '</button>',
      '    <button class="btn danger" id="btnDelete">删除镜像</button>',
      '  </div>',
      '</div>',
      '<div id="conversation"></div>',
    ].join('\n');

    $('sidCopy').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(session.sessionId);
        toast('会话 ID 已复制');
      } catch {
        const ta = document.createElement('textarea');
        ta.value = session.sessionId;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        toast('会话 ID 已复制');
      }
    });

    $('btnRestoreCross').addEventListener('click', (e) => doRestore(session.sessionId, otherTool, e.target));
    $('btnRestoreSame').addEventListener('click', (e) => doRestore(session.sessionId, session.sourceTool, e.target));
    $('btnDelete').addEventListener('click', async () => {
      if (!confirm('确定删除这条会话镜像吗?\n\n' + title + '\n\n只会删除 session-loom 的镜像数据, 不影响原始会话文件。')) return;
      try {
        await api.remove(session.sessionId);
        toast('镜像已删除');
        state.fingerprint = '';
        clearDetail();
        loadSessions(false);
      } catch (e) {
        toast('删除失败: ' + (e.message || e), false);
      }
    });

    const conv = $('conversation');
    const frag = document.createDocumentFragment();
    for (const m of session.messages) {
      const hasText = m.text && m.text.trim();
      const hasTools = m.toolCalls && m.toolCalls.length;
      if (!hasText && !hasTools) continue;
      const div = document.createElement('div');
      div.className = 'msg ' + m.role;
      let html = '<div class="role">' + (m.role === 'user' ? '用户' : '助手') + '</div>';
      if (hasText) html += '<div class="text">' + escapeHtml(m.text) + '</div>';
      for (const tc of m.toolCalls || []) {
        html += '<details class="tool"><summary>⚙ ' + escapeHtml(tc.name) + '</summary>';
        html += '<pre>' + escapeHtml(truncate(JSON.stringify(tc.input, null, 2) || '', 4000)) + '</pre>';
        if (tc.output) html += '<pre>' + escapeHtml(truncate(tc.output, 4000)) + '</pre>';
        html += '</details>';
      }
      div.innerHTML = html;
      frag.appendChild(div);
    }
    conv.innerHTML = '';
    conv.appendChild(frag);
    if (!conv.children.length) {
      conv.innerHTML = '<div class="empty">这个会话没有可显示的对话内容</div>';
    }
  }

  async function doRestore(sessionId, target, btn) {
    btn.disabled = true;
    const old = btn.textContent;
    btn.textContent = '恢复中…';
    try {
      const res = await api.restore(sessionId, target);
      toast(res.message, res.ok);
    } catch (e) {
      toast('恢复失败: ' + (e.message || e), false);
    } finally {
      btn.disabled = false;
      btn.textContent = old;
    }
  }

  async function refreshDaemon() {
    try {
      const s = await api.daemonStatus();
      $('daemonPill').classList.toggle('on', !!s.running);
      $('daemonText').textContent = s.running ? '守护进程 · 运行中 (pid ' + s.pid + ')' : '守护进程 · 已停止';
    } catch {
      $('daemonText').textContent = '守护进程 · 未知';
    }
  }

  $('daemonPill').addEventListener('click', async () => {
    try {
      await api.daemonToggle();
      await refreshDaemon();
    } catch (e) {
      toast('守护进程操作失败: ' + (e.message || e), false);
    }
  });

  let searchTimer;
  $('search').addEventListener('input', (e) => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      state.query = e.target.value;
      state.fingerprint = '';
      loadSessions(false);
    }, 220);
  });

  for (const tab of document.querySelectorAll('.tab')) {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach((t) => t.classList.remove('active'));
      tab.classList.add('active');
      state.tool = tab.dataset.tool;
      state.fingerprint = '';
      loadSessions(false);
    });
  }

  setInterval(() => {
    if (!document.hidden) {
      loadSessions();
      refreshDaemon();
    }
  }, 3000);

  loadSessions(false);
  refreshDaemon();
</script>
</body>
</html>
