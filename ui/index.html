<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>Session-Loom</title>
<link rel="icon" href="icon.png" />
<style>
:root {
  --bg: #F6F4EF;
  --bg-soft: #FFFFFF;
  --panel: #FFFFFF;
  --panel-2: #EFECE3;
  --border: rgba(31, 30, 27, .10);
  --border-strong: rgba(31, 30, 27, .20);
  --text: #24231F;
  --text-dim: #6E6A60;
  --text-faint: #A8A394;
  --accent: #BF4E24;
  --accent-soft: rgba(191, 78, 36, .10);
  --accent-strong: #A83F1B;
  --accent-ink: #FFFFFF;
  --ok: #1F9D66;
  --codex: #0270C7;
  --claude: #C2410C;
  --danger: #D93F3F;
  --scroll: rgba(31, 30, 27, .16);
  --scroll-hover: rgba(31, 30, 27, .26);
  --mono: 'Cascadia Code', 'JetBrains Mono', Consolas, 'Courier New', monospace;
  --radius: 10px;
  --ease: 160ms cubic-bezier(.4, 0, .2, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }

body {
  display: grid;
  grid-template-rows: 50px 1fr;
  height: 100vh;
  background: var(--bg);
  color: var(--text);
  font: 13.5px/1.6 -apple-system, 'Segoe UI Variable Text', 'Segoe UI', 'Microsoft YaHei UI', 'PingFang SC', sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
}

::selection { background: rgba(191, 78, 36, .18); }

::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: var(--scroll-hover); border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-track { background: transparent; }

header {
  display: flex; align-items: center; gap: 12px;
  padding: 0 16px;
  background: var(--bg-soft);
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 9px; font-weight: 650; font-size: 14px; letter-spacing: .2px; }
.brand .loom { width: 22px; height: 22px; border-radius: 6px; }
.spacer { flex: 1; }
.github-link {
  color: var(--text-dim); text-decoration: none;
  padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px;
  font-size: 11.5px; line-height: 16px;
  transition: border-color var(--ease), color var(--ease), background var(--ease);
}
.github-link:hover { color: var(--text); border-color: var(--border-strong); background: var(--bg); }
.count-pill { color: var(--text-faint); font-size: 12px; font-variant-numeric: tabular-nums; }

.daemon-pill {
  display: flex; align-items: center; gap: 7px;
  padding: 4px 11px; border-radius: 999px;
  border: 1px solid var(--border);
  background: transparent; color: var(--text-dim);
  font: inherit; font-size: 11.5px; cursor: pointer; user-select: none;
  transition: border-color var(--ease), color var(--ease), background var(--ease);
}
button.daemon-pill { height: 25px; }
.daemon-pill:hover { border-color: var(--border-strong); color: var(--text); }
.daemon-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: #C5C0B4; transition: background var(--ease), box-shadow var(--ease); }
.daemon-pill.on .dot { background: var(--ok); box-shadow: 0 0 6px rgba(31, 157, 102, .6); }
.daemon-pill.on { color: var(--text); }

main { display: grid; grid-template-columns: 336px 1fr; min-height: 0; }

aside {
  display: flex; flex-direction: column; min-height: 0;
  border-right: 1px solid var(--border);
  background: var(--bg-soft);
}
.side-tools { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
#sessionTools.hidden { display: none; }
#trashTools { display: none; }
#trashTools.active { display: flex; }

#search {
  width: 100%; padding: 7px 12px;
  background: var(--bg); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px;
  font-size: 12.5px; outline: none;
  transition: border-color var(--ease);
}
#search::placeholder { color: var(--text-faint); }
#search:focus { border-color: rgba(191, 78, 36, .5); }

.tabs {
  display: flex; gap: 2px;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 2px;
}
.tab {
  flex: 1; text-align: center; padding: 5px 0;
  border-radius: 6px; border: none;
  background: transparent; color: var(--text-dim);
  font-size: 12px; cursor: pointer;
  transition: background var(--ease), color var(--ease);
}
.tab:hover { color: var(--text); }
.tab.active { background: var(--bg-soft); color: var(--text); box-shadow: 0 1px 2px rgba(31, 30, 27, .12); }

#sessionList { flex: 1; overflow-y: auto; padding: 4px 8px 14px; }
.card {
  position: relative;
  padding: 10px 12px 10px 14px; margin: 4px 2px;
  background: transparent; border: 1px solid transparent;
  border-radius: var(--radius); cursor: pointer;
  transition: background var(--ease), border-color var(--ease);
}
.card:hover { background: var(--bg); border-color: var(--border); }
.card.active { background: var(--accent-soft); border-color: rgba(191, 78, 36, .35); }
.card.active::before {
  content: ''; position: absolute; left: 0; top: 10px; bottom: 10px;
  width: 3px; border-radius: 2px; background: var(--accent);
}
.card .title {
  font-size: 13px; font-weight: 600; line-height: 1.45;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; word-break: break-word;
}
.card .meta { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.card .cwd {
  margin-top: 5px; font-family: var(--mono); font-size: 10.5px; color: var(--text-faint);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.rel { margin-left: auto; font-size: 11px; color: var(--text-faint); white-space: nowrap; font-variant-numeric: tabular-nums; }
.count { font-size: 11px; color: var(--text-faint); font-variant-numeric: tabular-nums; }

.badge {
  display: inline-flex; align-items: center;
  padding: 1px 7px; border-radius: 5px;
  font-size: 10.5px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase;
}
.badge.codex { color: var(--codex); background: rgba(2, 112, 199, .09); }
.badge.claude { color: var(--claude); background: rgba(194, 65, 12, .09); }
.badge.opencode { color: #0E7C66; background: rgba(14, 124, 102, .09); }
.badge.dsh { color: #6D3FD6; background: rgba(109, 63, 214, .09); }
.badge.pi { color: #A05A00; background: rgba(160, 90, 0, .10); }
.tool-stack { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 3px; }
.tool-stack .badge { padding: 1px 5px; font-size: 9.5px; }
.tool-linked { color: var(--text-faint); font-size: 11px; }

#detail { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
#detailBody { display: none; }
#detailBody.open { display: flex; flex: 1; flex-direction: column; min-height: 0; }

.detail-head { padding: 18px 24px 16px; border-bottom: 1px solid var(--border); background: var(--bg-soft); }
.detail-head h1 { font-size: 16.5px; font-weight: 650; line-height: 1.5; word-break: break-word; letter-spacing: .1px; }
.detail-sub { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 8px; color: var(--text-dim); font-size: 12px; }
.detail-sub .cwd { font-family: var(--mono); font-size: 11px; color: var(--text-dim); word-break: break-all; }
.sid { font-family: var(--mono); font-size: 11px; color: var(--text-faint); cursor: pointer; transition: color var(--ease); }
.sid:hover { color: var(--text-dim); }
.actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }

.btn {
  padding: 6px 14px; border-radius: 8px;
  border: 1px solid var(--border-strong);
  background: transparent; color: var(--text);
  font-size: 12.5px; font-weight: 600; cursor: pointer;
  transition: background var(--ease), border-color var(--ease), filter var(--ease);
}
.btn:hover { background: var(--panel-2); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 1px 2px rgba(31, 30, 27, .18); }
.btn.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
.btn.danger { border-color: rgba(217, 63, 63, .4); color: var(--danger); }
.btn.danger:hover { background: rgba(217, 63, 63, .08); border-color: rgba(217, 63, 63, .6); }
.btn.linked { color: var(--text-faint); border-color: var(--border); cursor: default; }
.btn.linked:hover { background: transparent; }
.btn.block { display: block; width: 100%; }

.trash-note { font-size: 11.5px; color: var(--text-dim); line-height: 1.55; }

#conversation { flex: 1; overflow-y: auto; padding: 20px 24px 32px; }
.msg {
  margin: 0 0 12px; padding: 12px 16px;
  border-radius: var(--radius);
  background: var(--panel); border: 1px solid var(--border);
}
.msg.user { background: var(--accent-soft); border-color: rgba(191, 78, 36, .25); }
.msg .role { font-size: 10.5px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text-faint); margin-bottom: 5px; }
.msg.user .role { color: var(--accent-strong); }
.msg .text { white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere; font-size: 13.5px; }

details.tool { margin-top: 8px; background: rgba(31, 30, 27, .045); border: 1px solid var(--border); border-radius: 8px; }
details.tool summary {
  cursor: pointer; padding: 6px 11px;
  font-family: var(--mono); font-size: 11.5px; color: var(--accent-strong);
  list-style: none; user-select: none;
  transition: color var(--ease);
}
details.tool summary:hover { color: var(--accent); }
details.tool summary::before { content: '\25B8 '; color: var(--text-faint); }
details.tool[open] summary::before { content: '\25BE '; }
details.tool pre {
  margin: 0 11px 10px; padding: 9px 11px;
  background: var(--bg); border-radius: 6px;
  font-family: var(--mono); font-size: 11.5px; line-height: 1.55; color: var(--text-dim);
  white-space: pre-wrap; word-break: break-word;
  max-height: 280px; overflow-y: auto;
}

.empty { flex: 1; display: grid; place-items: center; color: var(--text-faint); font-size: 13px; text-align: center; padding: 40px; line-height: 2; }
.empty-logo { width: 56px; height: 56px; border-radius: 14px; margin-bottom: 14px; opacity: .9; }

body.modal-open { overflow: hidden; }

#deleteModal {
  position: fixed; inset: 0; z-index: 80;
  display: none; align-items: center; justify-content: center;
  padding: 24px;
}
#deleteModal.open { display: flex; }
.delete-backdrop {
  position: absolute; inset: 0;
  background: rgba(36, 35, 31, .34);
  backdrop-filter: blur(3px);
  animation: modal-fade-in 160ms ease-out;
}
.delete-dialog {
  position: relative; width: min(460px, 100%);
  padding: 24px; border: 1px solid var(--border-strong);
  border-radius: 16px; background: var(--panel);
  box-shadow: 0 24px 70px rgba(36, 35, 31, .24);
  animation: modal-slide-in 180ms cubic-bezier(.2, .8, .2, 1);
}
.delete-heading { display: flex; align-items: flex-start; gap: 13px; }
.delete-mark {
  display: grid; place-items: center; flex: 0 0 40px; height: 40px;
  border-radius: 12px; background: rgba(217, 63, 63, .10);
  color: var(--danger); font-size: 20px; font-weight: 800;
}
.delete-kicker {
  margin-bottom: 2px; color: var(--danger); font-size: 10.5px;
  font-weight: 750; letter-spacing: 1.2px; text-transform: uppercase;
}
.delete-dialog h2 { font-size: 18px; line-height: 1.35; font-weight: 700; }
.delete-copy { margin: 17px 0 15px; color: var(--text-dim); line-height: 1.65; }
.delete-summary {
  display: grid; gap: 9px; padding: 12px 14px;
  border: 1px solid var(--border); border-radius: 10px;
  background: var(--bg); font-size: 12px;
}
.delete-summary-row { display: grid; grid-template-columns: 48px 1fr; gap: 12px; min-width: 0; }
.delete-summary-row > span { color: var(--text-faint); }
.delete-summary-row > strong,
.delete-summary-row > code {
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  color: var(--text); font: inherit;
}
.delete-summary-row > code { font-family: var(--mono); font-size: 11px; color: var(--text-dim); }
.delete-footnote { margin-top: 12px; color: var(--text-faint); font-size: 11px; }
.delete-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px; }
.delete-actions .btn { min-width: 88px; }
.btn.delete-confirm { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.delete-confirm:hover { background: #B92F36; border-color: #B92F36; }
@keyframes modal-fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes modal-slide-in { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

#toast {
  position: fixed; right: 18px; bottom: 18px; z-index: 50;
  max-width: 460px; padding: 11px 15px;
  background: var(--panel); border: 1px solid var(--border-strong);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius); font-size: 12.5px;
  box-shadow: 0 12px 32px rgba(31, 30, 27, .16);
  opacity: 0; transform: translateY(8px);
  transition: opacity 200ms, transform 200ms;
  pointer-events: none; word-break: break-all;
}
#toast.show { opacity: 1; transform: translateY(0); }
#toast.err { border-left-color: var(--danger); }
</style>
</head>
<body>
  <header>
    <div class="brand"><img class="loom" src="icon.png" alt="" /> Session-Loom</div>
    <div class="spacer"></div>
    <a class="github-link" id="githubLink" href="https://github.com/JC0v0/session-loom" target="_blank" rel="noopener noreferrer" title="打开 GitHub 仓库">GitHub ↗</a>
    <span class="count-pill" id="countPill"></span>
    <button class="daemon-pill" id="openTrash" title="查看已删除的会话">回收站</button>
    <div class="daemon-pill" id="daemonPill" title="点击启动/停止镜像守护进程">
      <span class="dot"></span><span id="daemonText">守护进程</span>
    </div>
  </header>

  <main>
    <aside>
      <div class="side-tools" id="sessionTools">
        <input id="search" type="search" placeholder="搜索会话内容或目录…" autocomplete="off" />
        <div class="tabs">
          <button class="tab active" data-tool="all">全部</button>
          <button class="tab" data-tool="codex">Codex</button>
          <button class="tab" data-tool="claude">Claude</button>
          <button class="tab" data-tool="opencode">OpenCode</button>
          <button class="tab" data-tool="dsh">DSH</button>
          <button class="tab" data-tool="pi">Pi</button>
        </div>
      </div>
      <div class="side-tools" id="trashTools">
        <div class="trash-note" id="trashNote">回收站 · 删除后 30 天内可恢复</div>
        <button class="btn block" id="closeTrash">← 返回会话列表</button>
      </div>
      <div id="sessionList"></div>
    </aside>

    <section id="detail">
      <div class="empty" id="emptyState">
        <div>
          <img class="empty-logo" src="icon.png" alt="" />
          从左侧选择一个会话查看对话内容<br />选中后可将其恢复到 Codex / Claude / OpenCode / DSH / Pi 继续对话
        </div>
      </div>
      <div id="detailBody"></div>
    </section>
  </main>

  <div id="deleteModal" aria-hidden="true">
    <div class="delete-backdrop" data-delete-cancel></div>
    <section class="delete-dialog" role="dialog" aria-modal="true" aria-labelledby="deleteModalTitle">
      <div class="delete-heading">
        <div class="delete-mark">!</div>
        <div>
          <div class="delete-kicker" id="deleteKicker">危险操作</div>
          <h2 id="deleteModalTitle">删除这条会话？</h2>
        </div>
      </div>
      <p class="delete-copy" id="deleteCopy">源工具中的会话会被尽力删除，canonical 镜像会先归档到 30 天回收站，之后仍可恢复。</p>
      <div class="delete-summary">
        <div class="delete-summary-row"><span>会话</span><strong id="deleteTitle"></strong></div>
        <div class="delete-summary-row"><span>来源</span><strong id="deleteSource"></strong></div>
        <div class="delete-summary-row"><span>项目</span><code id="deleteProject"></code></div>
      </div>
      <div class="delete-footnote" id="deleteFootnote">删除源文件失败时，回收站中的 canonical 镜像仍会保留。</div>
      <div class="delete-actions">
        <button class="btn" id="deleteCancel" type="button">取消</button>
        <button class="btn delete-confirm" id="deleteConfirm" type="button">删除并移入回收站</button>
      </div>
    </section>
  </div>
  <div id="toast"></div>

<script>
  const { invoke } = window.__TAURI__.core;
  const api = {
    list: (filter) => invoke('sessions_list', { filter }),
    get: (id) => invoke('sessions_get', { sessionId: id }),
    remove: (id) => invoke('sessions_delete', { sessionId: id }),
    restore: (id, target) => invoke('sessions_restore', { sessionId: id, target }),
    trashList: () => invoke('trash_list'),
    trashRestore: (id) => invoke('trash_restore', { sessionId: id }),
    trashRemove: (id) => invoke('trash_delete', { sessionId: id }),
    daemonStatus: () => invoke('daemon_status'),
    daemonToggle: () => invoke('daemon_toggle'),
    openGithub: () => invoke('open_github'),
  };
  const TOOL_LABELS = { codex: 'Codex', claude: 'Claude', opencode: 'OpenCode', dsh: 'DSH', pi: 'Pi' };
  const toolLabel = (tool) => TOOL_LABELS[tool] || tool;
  const state = {
    tool: 'all', query: '', sessions: [], selectedId: null, selectedConversationId: null, fingerprint: '',
    mode: 'sessions', trash: [], trashSelectedId: null, trashFingerprint: '',
  };

  const $ = (id) => document.getElementById(id);
  const listEl = $('sessionList');
  const emptyEl = $('emptyState');
  const bodyEl = $('detailBody');

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function relTime(iso) {
    const t = new Date(iso).getTime();
    if (!Number.isFinite(t)) return '';
    const s = Math.max(0, (Date.now() - t) / 1000);
    if (s < 60) return '刚刚';
    if (s < 3600) return Math.floor(s / 60) + ' 分钟前';
    if (s < 86400) return Math.floor(s / 3600) + ' 小时前';
    if (s < 86400 * 30) return Math.floor(s / 86400) + ' 天前';
    return new Date(t).toLocaleDateString();
  }

  function fmtTime(iso) {
    const d = new Date(iso);
    return Number.isFinite(d.getTime()) ? d.toLocaleString() : iso;
  }

  let toastTimer;
  function toast(message, ok = true) {
    const el = $('toast');
    el.textContent = message;
    el.className = 'show' + (ok ? '' : ' err');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.className = ''; }, 5200);
  }

  let deleteResolver = null;
  let deleteTrigger = null;
  function closeDeleteModal(confirmed) {
    const modal = $('deleteModal');
    modal.classList.remove('open');
    modal.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('modal-open');
    const resolver = deleteResolver;
    deleteResolver = null;
    const trigger = deleteTrigger;
    deleteTrigger = null;
    if (trigger) trigger.focus();
    if (resolver) resolver(confirmed);
  }

  function confirmDelete(session, title, trigger, permanent = false) {
    const modal = $('deleteModal');
    $('deleteKicker').textContent = permanent ? '不可撤销' : '危险操作';
    $('deleteModalTitle').textContent = permanent ? '彻底删除这条会话？' : '删除这条会话？';
    $('deleteCopy').textContent = permanent
      ? '这条会话会从回收站和本地存储中永久移除，之后无法恢复。'
      : '源工具中的会话会被尽力删除，canonical 镜像会先归档到 30 天回收站，之后仍可恢复。';
    $('deleteFootnote').textContent = permanent
      ? '这是最后一步，建议确认不再需要这段对话。'
      : '删除源文件失败时，回收站中的 canonical 镜像仍会保留。';
    $('deleteConfirm').textContent = permanent ? '彻底删除' : '删除并移入回收站';
    $('deleteTitle').textContent = title || '(空会话)';
    $('deleteSource').textContent = toolLabel(session.sourceTool);
    $('deleteProject').textContent = session.cwd || '未记录项目';
    deleteTrigger = trigger;
    modal.classList.add('open');
    modal.setAttribute('aria-hidden', 'false');
    document.body.classList.add('modal-open');
    $('deleteConfirm').focus();
    return new Promise((resolve) => { deleteResolver = resolve; });
  }

  $('deleteCancel').addEventListener('click', () => closeDeleteModal(false));
  $('deleteConfirm').addEventListener('click', () => closeDeleteModal(true));
  $('deleteModal').addEventListener('click', (event) => {
    if (event.target.matches('[data-delete-cancel]')) closeDeleteModal(false);
  });
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && $('deleteModal').classList.contains('open')) {
      closeDeleteModal(false);
    }
  });

  let sessionLoadVersion = 0;
  async function loadSessions(keepScroll = true) {
    const requestVersion = ++sessionLoadVersion;
    const scroll = listEl.scrollTop;
    try {
      const sessions = await api.list({ tool: state.tool === 'all' ? undefined : state.tool, query: state.query });
      if (requestVersion !== sessionLoadVersion || state.mode !== 'sessions') return;
      state.sessions = sessions;
      $('countPill').textContent = sessions.length + ' 个会话';
      const fp = JSON.stringify(sessions.map((s) => [s.conversationId, s.sessionId, s.updatedAt, s.instanceCount, s.tools]));
      if (fp !== state.fingerprint) {
        state.fingerprint = fp;
        renderList();
      }
      if (keepScroll) listEl.scrollTop = scroll;
      const selectedCard = state.selectedConversationId && sessions.find((s) => s.conversationId === state.selectedConversationId);
      if (selectedCard) {
        state.selectedId = selectedCard.sessionId;
      } else if (state.selectedConversationId) {
        clearDetail();
      }
    } catch (e) {
      if (requestVersion !== sessionLoadVersion) return;
      toast('加载会话失败: ' + (e.message || e), false);
    }
  }

  function renderList() {
    if (!state.sessions.length) {
      listEl.innerHTML = '<div class="empty">没有匹配的会话</div>';
      return;
    }
    listEl.innerHTML = state.sessions.map((s) => [
      '<div class="card' + (s.conversationId === state.selectedConversationId ? ' active' : '') + '" data-id="' + escapeHtml(s.conversationId) + '">',
      '  <div class="title">' + escapeHtml(s.title) + '</div>',
      '  <div class="meta">',
      '    <span class="tool-stack">' + (s.tools || [s.sourceTool]).map((tool) => '<span class="badge ' + tool + '">' + toolLabel(tool) + '</span>').join('') + '</span>',
      '    <span class="count">' + s.messageCount + ' 条消息</span>',
      s.instanceCount > 1 ? '    <span class="tool-linked">' + s.instanceCount + ' 个副本</span>' : '',
      '    <span class="rel" title="' + escapeHtml(fmtTime(s.updatedAt)) + '">' + relTime(s.updatedAt) + '</span>',
      '  </div>',
      '  <div class="cwd" title="' + escapeHtml(s.cwd) + '">' + escapeHtml(s.cwd) + '</div>',
      '</div>',
    ].join('\n')).join('\n');
    for (const card of listEl.querySelectorAll('.card')) {
      card.addEventListener('click', () => selectSession(card.dataset.id));
    }
  }

  function clearDetail() {
    state.selectedId = null;
    state.selectedConversationId = null;
    state.trashSelectedId = null;
    emptyEl.style.display = 'grid';
    bodyEl.classList.remove('open');
    bodyEl.innerHTML = '';
    if (state.mode === 'trash') {
      renderTrashList();
    } else {
      renderList();
    }
  }

  async function selectSession(conversationId) {
    const card = state.sessions.find((item) => item.conversationId === conversationId);
    if (!card) return;
    state.selectedConversationId = conversationId;
    state.selectedId = card.sessionId;
    renderList();
    let session;
    try {
      session = await api.get(card.sessionId);
    } catch (e) {
      toast('读取会话失败: ' + (e.message || e), false);
      return;
    }
    renderDetail(session, card);
  }

  function truncate(s, n) {
    s = String(s == null ? '' : s);
    return s.length > n ? s.slice(0, n) + '\n… (截断, 共 ' + s.length + ' 字符)' : s;
  }

  function sessionTitle(session) {
    const firstUser = session.messages.find((m) => m.role === 'user' && m.text && m.text.trim());
    const t = firstUser ? firstUser.text.trim().replace(/\s+/g, ' ') : '(空会话)';
    return t.length > 120 ? t.slice(0, 120) + '…' : t;
  }

  function renderDetail(session, card) {
    emptyEl.style.display = 'none';
    bodyEl.classList.add('open');
    const linkedTools = card && card.tools && card.tools.length ? card.tools : [session.sourceTool];
    const linkedInstances = card && card.instanceCount ? card.instanceCount : linkedTools.length;
    const otherTools = Object.keys(TOOL_LABELS).filter((tool) => tool !== session.sourceTool);
    const toolCalls = session.messages.reduce((n, m) => n + ((m.toolCalls && m.toolCalls.length) || 0), 0);
    const title = sessionTitle(session);

    bodyEl.innerHTML = [
      '<div class="detail-head">',
      '  <h1>' + escapeHtml(title) + '</h1>',
      '  <div class="detail-sub">',
      '    <span class="tool-stack">' + linkedTools.map((tool) => '<span class="badge ' + tool + '">' + toolLabel(tool) + '</span>').join('') + '</span>',
      '    <span>' + session.messages.length + ' 条消息 · ' + toolCalls + ' 次工具调用</span>',
      '    <span>更新于 ' + escapeHtml(fmtTime(session.updatedAt)) + '</span>',
      '  </div>',
      '  <div class="detail-sub"><span class="cwd">' + escapeHtml(session.cwd) + '</span></div>',
      '  <div class="detail-sub"><span class="tool-linked">' + linkedInstances + ' 个副本已关联</span></div>',
      '  <div class="detail-sub"><span class="sid" id="sidCopy" title="点击复制会话 ID">' + escapeHtml(session.sessionId) + '</span></div>',
      '  <div class="actions">',
    ].concat(
      otherTools.map((tool, index) =>
        '    <button class="btn' + (index === 0 ? ' primary' : '') + '" id="btnRestore-' + tool + '">恢复到 ' + toolLabel(tool) + ' 继续对话</button>'
      ),
      [
        '    <button class="btn danger" id="btnDelete">删除会话</button>',
        '  </div>',
        '</div>',
        '<div id="conversation"></div>',
      ]
    ).join('\n');

    $('sidCopy').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(session.sessionId);
        toast('会话 ID 已复制');
      } catch {
        const ta = document.createElement('textarea');
        ta.value = session.sessionId;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        toast('会话 ID 已复制');
      }
    });

    for (const tool of otherTools) {
      const button = $('btnRestore-' + tool);
      if (!button) continue;
      if (linkedTools.includes(tool)) {
        button.disabled = true;
        button.classList.add('linked');
        button.textContent = toolLabel(tool) + ' 已关联';
      } else {
        button.addEventListener('click', (e) => doRestore(session.sessionId, tool, e.target));
      }
    }
    $('btnDelete').addEventListener('click', async (event) => {
      const trigger = event.currentTarget;
      if (!await confirmDelete(session, title, trigger)) return;
      trigger.disabled = true;
      try {
        const res = await api.remove(session.sessionId);
        toast(res.message, res.ok);
        if (res.ok) {
          state.fingerprint = '';
          clearDetail();
          loadSessions(false);
        }
      } catch (e) {
        toast('删除失败: ' + (e.message || e), false);
      } finally {
        trigger.disabled = false;
      }
    });

    renderConversation(session);
  }

  function renderConversation(session) {
    const conv = $('conversation');
    const frag = document.createDocumentFragment();
    for (const m of session.messages) {
      const hasText = m.text && m.text.trim();
      const hasTools = m.toolCalls && m.toolCalls.length;
      if (!hasText && !hasTools) continue;
      const div = document.createElement('div');
      div.className = 'msg ' + m.role;
      let html = '<div class="role">' + (m.role === 'user' ? '用户' : '助手') + '</div>';
      if (hasText) html += '<div class="text">' + escapeHtml(m.text) + '</div>';
      for (const tc of m.toolCalls || []) {
        html += '<details class="tool"><summary>' + escapeHtml(tc.name) + '</summary>';
        html += '<pre>' + escapeHtml(truncate(JSON.stringify(tc.input, null, 2) || '', 4000)) + '</pre>';
        if (tc.output) html += '<pre>' + escapeHtml(truncate(tc.output, 4000)) + '</pre>';
        html += '</details>';
      }
      div.innerHTML = html;
      frag.appendChild(div);
    }
    conv.innerHTML = '';
    conv.appendChild(frag);
    if (!conv.children.length) {
      conv.innerHTML = '<div class="empty">这个会话没有可显示的对话内容</div>';
    }
  }

  async function doRestore(sessionId, target, btn) {
    btn.disabled = true;
    const old = btn.textContent;
    btn.textContent = '恢复中…';
    try {
      const res = await api.restore(sessionId, target);
      toast(res.message, res.ok);
      if (res.ok) {
        const conversationId = state.selectedConversationId;
        state.fingerprint = '';
        await loadSessions(false);
        if (conversationId && state.sessions.some((session) => session.conversationId === conversationId)) {
          await selectSession(conversationId);
        }
      }
    } catch (e) {
      toast('恢复失败: ' + (e.message || e), false);
    } finally {
      btn.disabled = false;
      btn.textContent = old;
    }
  }

  let trashLoadVersion = 0;
  async function loadTrash(keepScroll = true) {
    const requestVersion = ++trashLoadVersion;
    const scroll = listEl.scrollTop;
    try {
      const entries = await api.trashList();
      if (requestVersion !== trashLoadVersion || state.mode !== 'trash') return;
      state.trash = entries;
      $('trashNote').textContent = entries.length
        ? '回收站 · ' + entries.length + ' 项 · 删除后 30 天内可恢复'
        : '回收站是空的';
      $('countPill').textContent = entries.length + ' 个回收站条目';
      const fp = JSON.stringify(entries.map((e) => e.session.sessionId + e.deletedAt));
      if (fp !== state.trashFingerprint) {
        state.trashFingerprint = fp;
        renderTrashList();
      }
      if (keepScroll) listEl.scrollTop = scroll;
      if (state.trashSelectedId && !entries.some((e) => e.session.sessionId === state.trashSelectedId)) {
        clearDetail();
      }
    } catch (e) {
      if (requestVersion !== trashLoadVersion) return;
      toast('加载回收站失败: ' + (e.message || e), false);
    }
  }

  function renderTrashList() {
    if (!state.trash.length) {
      listEl.innerHTML = '<div class="empty">回收站是空的</div>';
      return;
    }
    listEl.innerHTML = state.trash.map((entry) => {
      const s = entry.session;
      const active = s.sessionId === state.trashSelectedId ? ' active' : '';
      return [
        '<div class="card' + active + '" data-id="' + escapeHtml(s.sessionId) + '">',
        '  <div class="title">' + escapeHtml(sessionTitle(s)) + '</div>',
        '  <div class="meta">',
        '    <span class="badge ' + s.sourceTool + '">' + toolLabel(s.sourceTool) + '</span>',
        '    <span class="count">' + s.messages.length + ' 条消息</span>',
        '    <span class="rel" title="' + escapeHtml(fmtTime(entry.deletedAt)) + '">删除于 ' + relTime(entry.deletedAt) + '</span>',
        '  </div>',
        '  <div class="cwd" title="' + escapeHtml(s.cwd) + '">' + escapeHtml(s.cwd) + '</div>',
        '</div>',
      ].join('\n');
    }).join('\n');
    for (const card of listEl.querySelectorAll('.card')) {
      card.addEventListener('click', () => selectTrashEntry(card.dataset.id));
    }
  }

  async function selectTrashEntry(id) {
    state.trashSelectedId = id;
    renderTrashList();
    const entry = state.trash.find((e) => e.session.sessionId === id);
    if (entry) renderTrashDetail(entry);
  }

  function renderTrashDetail(entry) {
    const session = entry.session;
    emptyEl.style.display = 'none';
    bodyEl.classList.add('open');
    const toolCalls = session.messages.reduce((n, m) => n + ((m.toolCalls && m.toolCalls.length) || 0), 0);
    const title = sessionTitle(session);

    bodyEl.innerHTML = [
      '<div class="detail-head">',
      '  <h1>' + escapeHtml(title) + '</h1>',
      '  <div class="detail-sub">',
      '    <span class="badge ' + session.sourceTool + '">' + toolLabel(session.sourceTool) + '</span>',
      '    <span>' + session.messages.length + ' 条消息 · ' + toolCalls + ' 次工具调用</span>',
      '    <span>删除于 ' + escapeHtml(fmtTime(entry.deletedAt)) + '</span>',
      '  </div>',
      '  <div class="detail-sub"><span class="cwd">' + escapeHtml(session.cwd) + '</span></div>',
      '  <div class="actions">',
      '    <button class="btn primary" id="btnTrashRestore">恢复到会话列表</button>',
      '    <button class="btn danger" id="btnTrashDelete">彻底删除</button>',
      '    <button class="btn" id="btnTrashBack">← 返回回收站</button>',
      '  </div>',
      '</div>',
      '<div id="conversation"></div>',
    ].join('\n');

    $('btnTrashRestore').addEventListener('click', async (e) => {
      e.target.disabled = true;
      try {
        await api.trashRestore(session.sessionId);
        toast('已恢复到会话列表');
        state.trashFingerprint = '';
        clearDetail();
        loadTrash(false);
      } catch (err) {
        toast('恢复失败: ' + (err.message || err), false);
        e.target.disabled = false;
      }
    });
    $('btnTrashDelete').addEventListener('click', async (e) => {
      const trigger = e.currentTarget;
      if (!await confirmDelete(session, title, trigger, true)) return;
      trigger.disabled = true;
      try {
        await api.trashRemove(session.sessionId);
        toast('已彻底删除');
        state.trashFingerprint = '';
        clearDetail();
        loadTrash(false);
      } catch (err) {
        toast('删除失败: ' + (err.message || err), false);
        e.target.disabled = false;
      }
    });
    $('btnTrashBack').addEventListener('click', () => clearDetail());

    renderConversation(session);
  }

  function enterTrashMode() {
    state.mode = 'trash';
    $('sessionTools').classList.add('hidden');
    $('trashTools').classList.add('active');
    $('openTrash').style.display = 'none';
    clearDetail();
    state.trashFingerprint = '';
    loadTrash(false);
  }

  function exitTrashMode() {
    state.mode = 'sessions';
    $('trashTools').classList.remove('active');
    $('sessionTools').classList.remove('hidden');
    $('openTrash').style.display = '';
    clearDetail();
    state.fingerprint = '';
    loadSessions(false);
  }

  $('openTrash').addEventListener('click', enterTrashMode);
  $('closeTrash').addEventListener('click', exitTrashMode);
  $('githubLink').addEventListener('click', (event) => {
    event.preventDefault();
    api.openGithub().catch((error) => toast('打开 GitHub 失败: ' + (error.message || error), false));
  });

  // The window close button hides to the tray. Reset transient views so the
  // next open always lands on the session list instead of the recycle bin.
  window.__TAURI__.event.listen('window-hidden', () => {
    if (state.mode === 'trash') exitTrashMode();
  }).catch(() => {});
  window.__TAURI__.event.listen('window-shown', () => {
    if (state.mode === 'trash') exitTrashMode();
  }).catch(() => {});

  async function refreshDaemon() {
    try {
      const s = await api.daemonStatus();
      $('daemonPill').classList.toggle('on', !!s.running);
      $('daemonText').textContent = s.running ? '守护进程 · 运行中 (pid ' + s.pid + ')' : '守护进程 · 已停止';
    } catch {
      $('daemonText').textContent = '守护进程 · 未知';
    }
  }

  $('daemonPill').addEventListener('click', async () => {
    try {
      await api.daemonToggle();
      await refreshDaemon();
    } catch (e) {
      toast('守护进程操作失败: ' + (e.message || e), false);
    }
  });

  let searchTimer;
  $('search').addEventListener('input', (e) => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      state.query = e.target.value;
      state.fingerprint = '';
      loadSessions(false);
    }, 220);
  });

  for (const tab of document.querySelectorAll('.tab')) {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach((t) => t.classList.remove('active'));
      tab.classList.add('active');
      state.tool = tab.dataset.tool;
      state.fingerprint = '';
      loadSessions(false);
    });
  }

  setInterval(() => {
    if (!document.hidden) {
      if (state.mode === 'trash') {
        loadTrash();
      } else {
        loadSessions();
      }
      refreshDaemon();
    }
  }, 3000);

  loadSessions(false);
  refreshDaemon();
</script>
</body>
</html>
