<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
<title>Session-Loom</title>
<link rel="icon" href="icon.png" />
<style>
:root {
  --bg: #F6F4EF;
  --bg-soft: #FFFFFF;
  --panel: #FFFFFF;
  --panel-2: #EFECE3;
  --border: rgba(31, 30, 27, .10);
  --border-strong: rgba(31, 30, 27, .20);
  --text: #24231F;
  --text-dim: #6E6A60;
  --text-faint: #A8A394;
  --accent: #BF4E24;
  --accent-soft: rgba(191, 78, 36, .10);
  --accent-strong: #A83F1B;
  --accent-ink: #FFFFFF;
  --ok: #1F9D66;
  --codex: #0270C7;
  --claude: #C2410C;
  --danger: #D93F3F;
  --scroll: rgba(31, 30, 27, .16);
  --scroll-hover: rgba(31, 30, 27, .26);
  --mono: 'Cascadia Code', 'JetBrains Mono', Consolas, 'Courier New', monospace;
  --radius: 10px;
  --ease: 160ms cubic-bezier(.4, 0, .2, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }

body {
  display: grid;
  grid-template-rows: 50px 1fr;
  height: 100vh;
  background: var(--bg);
  color: var(--text);
  font: 13.5px/1.6 -apple-system, 'Segoe UI Variable Text', 'Segoe UI', 'Microsoft YaHei UI', 'PingFang SC', sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
}

::selection { background: rgba(191, 78, 36, .18); }

::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: var(--scroll-hover); border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-track { background: transparent; }

header {
  display: flex; align-items: center; gap: 12px;
  padding: 0 16px;
  background: var(--bg-soft);
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 9px; font-weight: 650; font-size: 14px; letter-spacing: .2px; }
.brand .loom { width: 22px; height: 22px; border-radius: 6px; }
.spacer { flex: 1; }
.github-link {
  color: var(--text-dim); text-decoration: none;
  padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px;
  font-size: 11.5px; line-height: 16px;
  transition: border-color var(--ease), color var(--ease), background var(--ease);
}
.github-link:hover { color: var(--text); border-color: var(--border-strong); background: var(--bg); }
.count-pill { color: var(--text-faint); font-size: 12px; font-variant-numeric: tabular-nums; }

.daemon-pill {
  display: flex; align-items: center; gap: 7px;
  padding: 4px 11px; border-radius: 999px;
  border: 1px solid var(--border);
  background: transparent; color: var(--text-dim);
  font: inherit; font-size: 11.5px; cursor: pointer; user-select: none;
  transition: border-color var(--ease), color var(--ease), background var(--ease);
}
button.daemon-pill { height: 25px; }
.daemon-pill:hover { border-color: var(--border-strong); color: var(--text); }
.daemon-pill.on { color: var(--text); }
.daemon-ball {
  width: 26px; height: 26px; flex: 0 0 26px;
  overflow: visible; transition: opacity var(--ease), filter var(--ease);
}
.daemon-ball svg { display: block; width: 100%; height: 100%; overflow: visible; }
.daemon-pill.on .daemon-ball { filter: drop-shadow(0 0 4px rgba(31, 157, 102, .34)); }
.daemon-pill:not(.on) .daemon-ball { opacity: .62; filter: grayscale(.2); }
.update-pill { color: var(--accent-strong); border-color: rgba(191, 78, 36, .36); }
.update-pill:hover { color: var(--accent-strong); background: var(--accent-soft); border-color: rgba(191, 78, 36, .55); }
.update-pill:disabled { opacity: .72; }
#updatePill[hidden] { display: none; }

main { display: grid; grid-template-columns: 336px 1fr; min-height: 0; }

aside {
  display: flex; flex-direction: column; min-height: 0;
  border-right: 1px solid var(--border);
  background: var(--bg-soft);
}
.side-tools { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
#sessionTools.hidden { display: none; }
#trashTools { display: none; }
#trashTools.active { display: flex; }

#search {
  width: 100%; padding: 7px 12px;
  background: var(--bg); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px;
  font-size: 12.5px; outline: none;
  transition: border-color var(--ease);
}
#search::placeholder { color: var(--text-faint); }
#search:focus { border-color: rgba(191, 78, 36, .5); }

#sessionList { position: relative; flex: 1; overflow-y: auto; padding: 4px 8px 14px; }
.card {
  position: relative;
  padding: 10px 12px 10px 14px; margin: 4px 2px;
  background: transparent; border: 1px solid transparent;
  border-radius: var(--radius); cursor: pointer;
  transition: background var(--ease), border-color var(--ease);
}
.card:hover { background: var(--bg); border-color: var(--border); }
.card.active { background: var(--accent-soft); border-color: rgba(191, 78, 36, .35); }
.card.active::before {
  content: ''; position: absolute; left: 0; top: 10px; bottom: 10px;
  width: 3px; border-radius: 2px; background: var(--accent);
}
.card .title {
  font-size: 13px; font-weight: 600; line-height: 1.45;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; word-break: break-word;
}
.card .meta { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.card .cwd {
  margin-top: 5px; font-family: var(--mono); font-size: 10.5px; color: var(--text-faint);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.rel { margin-left: auto; font-size: 11px; color: var(--text-faint); white-space: nowrap; font-variant-numeric: tabular-nums; }
.count { font-size: 11px; color: var(--text-faint); font-variant-numeric: tabular-nums; }

.badge {
  display: inline-flex; align-items: center;
  padding: 1px 7px; border-radius: 5px;
  font-size: 10.5px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase;
}
.tool-icon {
  display: inline-flex; align-items: center; justify-content: center;
  width: 16px; height: 16px; flex: none;
}
.tool-icon img { width: 100%; height: 100%; display: block; }
.tool-icon.codex { color: var(--codex); }
.tool-icon.claude { color: var(--claude); }
.tool-icon.opencode { color: #0E7C66; }
.tool-icon.dsh { color: #6D3FD6; }
.tool-icon.pi { color: #A05A00; }
.badge.codex { color: var(--codex); background: rgba(2, 112, 199, .09); }
.badge.claude { color: var(--claude); background: rgba(194, 65, 12, .09); }
.badge.opencode { color: #0E7C66; background: rgba(14, 124, 102, .09); }
.badge.dsh { color: #6D3FD6; background: rgba(109, 63, 214, .09); }
.badge.pi { color: #A05A00; background: rgba(160, 90, 0, .10); }
.tool-stack { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 3px; }
.tool-stack .badge { padding: 1px 5px; font-size: 9.5px; }
.tool-linked { color: var(--text-faint); font-size: 11px; }

.project { position: relative; margin-top: 10px; }
.project-head {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 10px 5px 12px; border-radius: 8px;
  color: var(--text-faint);
  cursor: pointer; user-select: none;
  transition: background var(--ease), color var(--ease);
}
.project-head:hover { background: var(--bg); color: var(--text-dim); }
.project.open .project-head { color: var(--text-dim); }
.project-head .project-name {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-size: 10.5px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase;
}
.project-head .project-count {
  margin-left: auto; font-size: 10.5px; color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}
.project-sessions { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .28s var(--ease); }
.project.open .project-sessions { grid-template-rows: 1fr; }
.project-sessions-inner { position: relative; min-height: 0; overflow: hidden; }
.project-tree {
  position: absolute; left: 16px; z-index: 1;
  border-left: 1px dashed var(--border-strong);
  pointer-events: none;
}
.conversation-path,
.fork-path {
  position: absolute; z-index: 2;
  border-left: 1px dashed var(--project-accent, var(--accent));
  border-bottom: 1px dashed var(--project-accent, var(--accent));
  border-bottom-left-radius: 8px;
  pointer-events: none;
  transition: top .34s cubic-bezier(.22, 1, .36, 1), height .34s cubic-bezier(.22, 1, .36, 1);
  will-change: top, height;
}
.conversation-path { left: 16px; width: 24px; }
.fork-path { left: 28px; width: 30px; }
#sessionList .project .card {
  margin: 0 2px; padding: 6px 10px 7px 46px;
  background: transparent; border: none; border-radius: 8px;
}
#sessionList .project .card:hover { background: var(--bg); border-color: transparent; }
#sessionList .project .card.active,
#sessionList .project .card.active:hover { background: transparent; border-color: transparent; }
#sessionList .project .card.active::before { content: none; }
#sessionList .project .card::after {
  content: ''; position: absolute; left: 14px; top: 15px; width: 24px; z-index: 1;
  border-top: 1px dashed var(--border-strong);
}
#sessionList .project .card.active::after { opacity: 0; }
#sessionList .project .card .title { color: var(--text-dim); font-weight: 550; }
#sessionList .project .card.active .title { color: var(--text); font-weight: 650; }
#sessionList .project .card .meta { margin-top: 3px; }
.card .forks {
  display: flex; flex-direction: column; gap: 1px;
  position: relative;
  margin: 4px 0 2px -22px; padding: 2px 0 0 22px;
  border-top: 0;
}
#sessionList .project .card .forks::before { content: none; }
.fork {
  display: flex; align-items: center; gap: 6px;
  position: relative;
  padding: 2px 6px 2px 10px; border-radius: 6px; cursor: pointer;
  transition: background var(--ease);
}
.fork:hover { background: var(--bg-soft); }
#sessionList .project .card .fork.active .tool-icon {
  border-radius: 4px;
  outline: 2px solid color-mix(in srgb, var(--project-accent, var(--accent)) 45%, transparent);
  outline-offset: 2px;
}
#sessionList .project .card .fork.active .fork-rel { color: var(--text-dim); }
.fork-rel { margin-left: auto; font-size: 10.5px; color: var(--text-faint); font-variant-numeric: tabular-nums; }

#detail { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
#detailBody { display: none; }
#detailBody.open { display: flex; flex: 1; flex-direction: column; min-height: 0; }

.detail-head { padding: 18px 24px 16px; border-bottom: 1px solid var(--border); background: var(--bg-soft); }
.detail-head h1 { font-size: 16.5px; font-weight: 650; line-height: 1.5; word-break: break-word; letter-spacing: .1px; }
.detail-sub { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 8px; color: var(--text-dim); font-size: 12px; }
.detail-sub .cwd { font-family: var(--mono); font-size: 11px; color: var(--text-dim); word-break: break-all; }
.sid { font-family: var(--mono); font-size: 11px; color: var(--text-faint); cursor: pointer; transition: color var(--ease); }
.sid:hover { color: var(--text-dim); }
.actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 6px 14px; border-radius: 8px;
  border: 1px solid var(--border-strong);
  background: transparent; color: var(--text);
  font-size: 12.5px; font-weight: 600; cursor: pointer;
  transition: background var(--ease), border-color var(--ease), filter var(--ease);
}
.btn:hover { background: var(--panel-2); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 1px 2px rgba(31, 30, 27, .18); }
.btn.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
.btn.danger { border-color: rgba(217, 63, 63, .4); color: var(--danger); }
.btn.danger:hover { background: rgba(217, 63, 63, .08); border-color: rgba(217, 63, 63, .6); }
.btn.danger-outline { border-color: var(--border); color: var(--text-dim); }
.btn.danger-outline:hover { border-color: rgba(217, 63, 63, .4); color: var(--danger); }
.btn .tool-icon { width: 14px; height: 14px; }
.btn.primary .tool-icon img { filter: brightness(0) invert(1); }
.btn .icon-glyph { display: inline-flex; width: 14px; height: 14px; flex: none; }
.btn .icon-glyph svg { width: 100%; height: 100%; display: block; }
.btn.linked { color: var(--text-faint); border-color: var(--border); cursor: default; }
.btn.linked:hover { background: transparent; }
.btn.block { display: block; width: 100%; }


.trash-note { font-size: 11.5px; color: var(--text-dim); line-height: 1.55; }

#conversation { flex: 1; overflow-y: auto; padding: 20px 24px 32px; }
.msg {
  margin: 0 0 12px; padding: 12px 16px;
  border-radius: var(--radius);
  background: var(--panel); border: 1px solid var(--border);
}
.msg.user { background: var(--accent-soft); border-color: rgba(191, 78, 36, .25); }
.msg .role { font-size: 10.5px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text-faint); margin-bottom: 5px; }
.msg.user .role { color: var(--accent-strong); }
.msg .text { white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere; font-size: 13.5px; }

details.tool { margin-top: 8px; background: rgba(31, 30, 27, .045); border: 1px solid var(--border); border-radius: 8px; }
details.tool summary {
  cursor: pointer; padding: 6px 11px;
  font-family: var(--mono); font-size: 11.5px; color: var(--accent-strong);
  list-style: none; user-select: none;
  transition: color var(--ease);
}
details.tool summary:hover { color: var(--accent); }
details.tool summary::before { content: '\25B8 '; color: var(--text-faint); }
details.tool[open] summary::before { content: '\25BE '; }
details.tool pre {
  margin: 0 11px 10px; padding: 9px 11px;
  background: var(--bg); border-radius: 6px;
  font-family: var(--mono); font-size: 11.5px; line-height: 1.55; color: var(--text-dim);
  white-space: pre-wrap; word-break: break-word;
  max-height: 280px; overflow-y: auto;
}

.empty { flex: 1; display: grid; place-items: center; color: var(--text-faint); font-size: 13px; text-align: center; padding: 40px; line-height: 2; }
.empty-logo { width: 56px; height: 56px; border-radius: 14px; margin-bottom: 14px; opacity: .9; }

body.modal-open { overflow: hidden; }

#deleteModal {
  position: fixed; inset: 0; z-index: 80;
  display: none; align-items: center; justify-content: center;
  padding: 24px;
}
#deleteModal.open { display: flex; }
.delete-backdrop {
  position: absolute; inset: 0;
  background: rgba(36, 35, 31, .34);
  backdrop-filter: blur(3px);
  animation: modal-fade-in 160ms ease-out;
}
.delete-dialog {
  position: relative; width: min(460px, 100%);
  padding: 24px; border: 1px solid var(--border-strong);
  border-radius: 16px; background: var(--panel);
  box-shadow: 0 24px 70px rgba(36, 35, 31, .24);
  animation: modal-slide-in 180ms cubic-bezier(.2, .8, .2, 1);
}
.delete-heading { display: flex; align-items: flex-start; gap: 13px; }
.delete-mark {
  display: grid; place-items: center; flex: 0 0 40px; height: 40px;
  border-radius: 12px; background: rgba(217, 63, 63, .10);
  color: var(--danger); font-size: 20px; font-weight: 800;
}
.delete-kicker {
  margin-bottom: 2px; color: var(--danger); font-size: 10.5px;
  font-weight: 750; letter-spacing: 1.2px; text-transform: uppercase;
}
.delete-dialog h2 { font-size: 18px; line-height: 1.35; font-weight: 700; }
.delete-copy { margin: 17px 0 15px; color: var(--text-dim); line-height: 1.65; }
.delete-summary {
  display: grid; gap: 9px; padding: 12px 14px;
  border: 1px solid var(--border); border-radius: 10px;
  background: var(--bg); font-size: 12px;
}
.delete-summary-row { display: grid; grid-template-columns: 48px 1fr; gap: 12px; min-width: 0; }
.delete-summary-row > span { color: var(--text-faint); }
.delete-summary-row > strong,
.delete-summary-row > code {
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  color: var(--text); font: inherit;
}
.delete-summary-row > code { font-family: var(--mono); font-size: 11px; color: var(--text-dim); }
.delete-footnote { margin-top: 12px; color: var(--text-faint); font-size: 11px; }
.delete-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px; }
.delete-actions .btn { min-width: 88px; }
.btn.delete-confirm { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.delete-confirm:hover { background: #B92F36; border-color: #B92F36; }
@keyframes modal-fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes modal-slide-in { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

#toast {
  position: fixed; right: 18px; bottom: 18px; z-index: 50;
  max-width: 460px; padding: 11px 15px;
  background: var(--panel); border: 1px solid var(--border-strong);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius); font-size: 12.5px;
  box-shadow: 0 12px 32px rgba(31, 30, 27, .16);
  opacity: 0; transform: translateY(8px);
  transition: opacity 200ms, transform 200ms;
  pointer-events: none; word-break: break-all;
}
#toast.show { opacity: 1; transform: translateY(0); }
#toast.err { border-left-color: var(--danger); }
</style>
</head>
<body>
  <header>
    <div class="brand"><img class="loom" src="icon.png" alt="" /> Session-Loom</div>
    <div class="spacer"></div>
    <a class="github-link" id="githubLink" href="https://github.com/JC0v0/session-loom" target="_blank" rel="noopener noreferrer" title="打开 GitHub 仓库">GitHub ↗</a>
    <button class="daemon-pill update-pill" id="updatePill" type="button" hidden title="下载并安装新版本"></button>
    <span class="count-pill" id="countPill"></span>
    <button class="daemon-pill" id="openTrash" title="查看已删除的会话">回收站</button>
    <div class="daemon-pill" id="daemonPill" title="点击启动/停止镜像守护进程">
      <span class="daemon-ball" id="daemonBall" aria-hidden="true"></span>
      <span id="daemonText">守护进程</span>
    </div>
  </header>

  <main>
    <aside>
      <div class="side-tools" id="sessionTools">
        <input id="search" type="search" placeholder="搜索会话内容或目录…" autocomplete="off" />
      </div>
      <div class="side-tools" id="trashTools">
        <div class="trash-note" id="trashNote">回收站 · 删除后 30 天内可恢复</div>
        <button class="btn block" id="closeTrash">← 返回会话列表</button>
      </div>
      <div id="sessionList"></div>
    </aside>

    <section id="detail">
      <div class="empty" id="emptyState">
        <div>
          <img class="empty-logo" src="icon.png" alt="" />
          从左侧选择一个会话查看对话内容<br />选中后可将其恢复到 Codex / Claude / OpenCode / DSH / Pi 继续对话
        </div>
      </div>
      <div id="detailBody"></div>
    </section>
  </main>

  <div id="deleteModal" aria-hidden="true">
    <div class="delete-backdrop" data-delete-cancel></div>
    <section class="delete-dialog" role="dialog" aria-modal="true" aria-labelledby="deleteModalTitle">
      <div class="delete-heading">
        <div class="delete-mark">!</div>
        <div>
          <div class="delete-kicker" id="deleteKicker">危险操作</div>
          <h2 id="deleteModalTitle">删除这条会话？</h2>
        </div>
      </div>
      <p class="delete-copy" id="deleteCopy">源工具中的会话会被尽力删除，canonical 镜像会先归档到 30 天回收站，之后仍可恢复。</p>
      <div class="delete-summary">
        <div class="delete-summary-row"><span>会话</span><strong id="deleteTitle"></strong></div>
        <div class="delete-summary-row"><span>来源</span><strong id="deleteSource"></strong></div>
        <div class="delete-summary-row"><span>项目</span><code id="deleteProject"></code></div>
      </div>
      <div class="delete-footnote" id="deleteFootnote">删除源文件失败时，回收站中的 canonical 镜像仍会保留。</div>
      <div class="delete-actions">
        <button class="btn" id="deleteCancel" type="button">取消</button>
        <button class="btn delete-confirm" id="deleteConfirm" type="button">删除并移入回收站</button>
      </div>
    </section>
  </div>
  <div id="toast"></div>

<script src="emotion-ball/rings.js"></script>
<script src="emotion-ball/emotions.js"></script>
<script src="emotion-ball/ball.js"></script>
<script src="emotion-ball/engine.js"></script>
<script>
  const { invoke } = window.__TAURI__.core;
  const updater = window.__TAURI__.updater;
  const processApi = window.__TAURI__.process;
  const api = {
    list: (filter) => invoke('sessions_list', { filter }),
    get: (id) => invoke('sessions_get', { sessionId: id }),
    remove: (id) => invoke('sessions_delete', { sessionId: id }),
    restore: (id, target) => invoke('sessions_restore', { sessionId: id, target }),
    sync: (id, target) => invoke('sessions_sync', { sessionId: id, target }),
    trashList: () => invoke('trash_list'),
    trashRestore: (id) => invoke('trash_restore', { sessionId: id }),
    trashRemove: (id) => invoke('trash_delete', { sessionId: id }),
    daemonStatus: () => invoke('daemon_status'),
    daemonToggle: () => invoke('daemon_toggle'),
    openGithub: () => invoke('open_github'),
  };
  const TRANSFER_ACTIONS = {
    restore: {
      pending: '恢复中…',
      failure: '恢复失败: ',
      run: api.restore,
    },
    sync: {
      pending: '同步中…',
      failure: '同步失败: ',
      run: api.sync,
    },
  };
  const TOOL_LABELS = { codex: 'Codex', claude: 'Claude', opencode: 'OpenCode', dsh: 'DSH', pi: 'Pi' };
  const toolLabel = (tool) => TOOL_LABELS[tool] || tool;
  const toolIcon = (tool) => {
    const safe = String(tool).replace(/[^a-z]/gi, '');
    if (!TOOL_LABELS[safe]) return '';
    return '<span class="tool-icon ' + safe + '" title="' + toolLabel(safe) + '"><img src="icons/' + safe + '.svg" alt="' + toolLabel(safe) + '" draggable="false" /></span>';
  };
  const TRASH_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9.5 7V5.2A1.2 1.2 0 0 1 10.7 4h2.6a1.2 1.2 0 0 1 1.2 1.2V7m2.9 0-.8 12.2a2 2 0 0 1-2 1.8H9.4a2 2 0 0 1-2-1.8L6.6 7M10 11v6M14 11v6"/></g></svg>';
  const state = {
    query: '', sessions: [], selectedId: null, selectedConversationId: null, selectedForkId: null, fingerprint: '',
    expandedProject: localStorage.getItem('loomExpandedProject') || null,
    collapsedProjects: new Set(JSON.parse(localStorage.getItem('loomCollapsedProjects') || '[]')),
    mode: 'sessions', trash: [], trashSelectedId: null, trashFingerprint: '',
  };

  const $ = (id) => document.getElementById(id);
  const listEl = $('sessionList');
  const emptyEl = $('emptyState');
  const bodyEl = $('detailBody');
  const daemonBall = window.EmotionBall
    ? window.EmotionBall.create($('daemonBall'), {
      emotion: '00', shape: 'blob', color: '#F1EEE8', eyeColor: '#24231F',
      eyeScale: 1.35, autostart: true, lite: true, label: '守护进程状态'
    })
    : null;
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function projectKey(cwd) {
    return String(cwd || '').replace(/[\\/]+$/, '') || '(未知项目)';
  }

  function projectName(cwd) {
    const key = projectKey(cwd);
    if (key === '(未知项目)') return key;
    const parts = key.split(/[\\/]/).filter(Boolean);
    return parts[parts.length - 1] || key;
  }

  function projectAccent(key) {
    const palette = ['#E8590C', '#2563EB', '#7C3AED', '#059669', '#DB2777', '#0D9488'];
    let hash = 0;
    for (let i = 0; i < key.length; i++) hash = ((hash * 31) + key.charCodeAt(i)) >>> 0;
    return palette[hash % palette.length];
  }

  function sessionInstances(s) {
    return (s.instances && s.instances.length)
      ? s.instances
      : [{ sessionId: s.sessionId, sourceTool: s.sourceTool, updatedAt: s.updatedAt }];
  }

  function treePathMetrics(project) {
    const head = project.querySelector('.project-head');
    const cards = [...project.querySelectorAll('.card')];
    if (!head || !cards.length) return null;
    const projectRect = project.getBoundingClientRect();
    const headRect = head.getBoundingClientRect();
    const lastTitleRect = cards[cards.length - 1].querySelector('.title').getBoundingClientRect();
    const projectY = headRect.top - projectRect.top + (headRect.height / 2);
    const lastConversationY = lastTitleRect.top - projectRect.top + (lastTitleRect.height / 2);
    const activeCard = project.querySelector('.card.active');
    const activeFork = activeCard && activeCard.querySelector('.fork.active');
    if (!activeCard || !activeFork) return { projectY, lastConversationY };
    const titleRect = activeCard.querySelector('.title').getBoundingClientRect();
    const iconRect = (activeFork.querySelector('.tool-icon') || activeFork).getBoundingClientRect();
    const conversationY = titleRect.top - projectRect.top + (titleRect.height / 2);
    const forkY = iconRect.top - projectRect.top + (iconRect.height / 2);
    return {
      projectY,
      lastConversationY,
      conversationY,
      forkY,
    };
  }

  function setTreePath(path, top, bottom) {
    path.style.top = top + 'px';
    path.style.height = Math.max(8, bottom - top) + 'px';
  }

  function positionTreeDecorations() {
    for (const project of listEl.querySelectorAll('.project.open')) {
      project.querySelectorAll(':scope > .project-tree, :scope > .conversation-path, :scope > .fork-path').forEach((node) => node.remove());
      const metrics = treePathMetrics(project);
      if (!metrics) continue;
      const projectTree = document.createElement('div');
      projectTree.className = 'project-tree';
      setTreePath(projectTree, metrics.projectY, metrics.lastConversationY);
      project.prepend(projectTree);
      if (!Number.isFinite(metrics.conversationY) || !Number.isFinite(metrics.forkY)) continue;
      const conversationPath = document.createElement('div');
      conversationPath.className = 'conversation-path';
      setTreePath(conversationPath, metrics.projectY, metrics.conversationY);
      project.prepend(conversationPath);
      const forkPath = document.createElement('div');
      forkPath.className = 'fork-path';
      setTreePath(forkPath, metrics.conversationY, metrics.forkY);
      project.prepend(forkPath);
    }
  }

  function updateActiveSelection() {
    const project = listEl.querySelector('.project.open');
    if (!project) return;
    const inner = project.querySelector('.project-sessions-inner');
    for (const card of inner.querySelectorAll('.card')) {
      card.classList.toggle('active', card.dataset.id === state.selectedConversationId);
    }
    for (const fork of inner.querySelectorAll('.fork')) {
      fork.classList.toggle(
        'active',
        fork.dataset.id === state.selectedConversationId && fork.dataset.fork === state.selectedForkId,
      );
    }
    const metrics = treePathMetrics(project);
    let conversationPath = project.querySelector(':scope > .conversation-path');
    let forkPath = project.querySelector(':scope > .fork-path');
    if (!metrics) {
      if (conversationPath) conversationPath.remove();
      if (forkPath) forkPath.remove();
      return;
    }
    if (!conversationPath || !forkPath) {
      conversationPath = document.createElement('div');
      conversationPath.className = 'conversation-path';
      conversationPath.style.top = metrics.projectY + 'px';
      conversationPath.style.height = '0px';
      project.prepend(conversationPath);
      forkPath = document.createElement('div');
      forkPath.className = 'fork-path';
      forkPath.style.top = metrics.conversationY + 'px';
      forkPath.style.height = '0px';
      project.prepend(forkPath);
      requestAnimationFrame(() => {
        setTreePath(conversationPath, metrics.projectY, metrics.conversationY);
        setTreePath(forkPath, metrics.conversationY, metrics.forkY);
      });
      return;
    }
    setTreePath(conversationPath, metrics.projectY, metrics.conversationY);
    setTreePath(forkPath, metrics.conversationY, metrics.forkY);
  }

  function relTime(iso) {
    const t = new Date(iso).getTime();
    if (!Number.isFinite(t)) return '';
    const s = Math.max(0, (Date.now() - t) / 1000);
    if (s < 60) return '刚刚';
    if (s < 3600) return Math.floor(s / 60) + ' 分钟前';
    if (s < 86400) return Math.floor(s / 3600) + ' 小时前';
    if (s < 86400 * 30) return Math.floor(s / 86400) + ' 天前';
    return new Date(t).toLocaleDateString();
  }

  function fmtTime(iso) {
    const d = new Date(iso);
    return Number.isFinite(d.getTime()) ? d.toLocaleString() : iso;
  }

  let toastTimer;
  function toast(message, ok = true) {
    const el = $('toast');
    el.textContent = message;
    el.className = 'show' + (ok ? '' : ' err');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.className = ''; }, 5200);
  }

  let deleteResolver = null;
  let deleteTrigger = null;
  function closeDeleteModal(confirmed) {
    const modal = $('deleteModal');
    modal.classList.remove('open');
    modal.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('modal-open');
    const resolver = deleteResolver;
    deleteResolver = null;
    const trigger = deleteTrigger;
    deleteTrigger = null;
    if (trigger) trigger.focus();
    if (resolver) resolver(confirmed);
  }

  function confirmDelete(session, title, trigger, permanent = false) {
    const modal = $('deleteModal');
    $('deleteKicker').textContent = permanent ? '不可撤销' : '危险操作';
    $('deleteModalTitle').textContent = permanent ? '彻底删除这条会话？' : '删除这条会话？';
    $('deleteCopy').textContent = permanent
      ? '这条会话会从回收站和本地存储中永久移除，之后无法恢复。'
      : '源工具中的会话会被尽力删除，canonical 镜像会先归档到 30 天回收站，之后仍可恢复。';
    $('deleteFootnote').textContent = permanent
      ? '这是最后一步，建议确认不再需要这段对话。'
      : '删除源文件失败时，回收站中的 canonical 镜像仍会保留。';
    $('deleteConfirm').textContent = permanent ? '彻底删除' : '删除并移入回收站';
    $('deleteTitle').textContent = title || '(空会话)';
    $('deleteSource').textContent = toolLabel(session.sourceTool);
    $('deleteProject').textContent = session.cwd || '未记录项目';
    deleteTrigger = trigger;
    modal.classList.add('open');
    modal.setAttribute('aria-hidden', 'false');
    document.body.classList.add('modal-open');
    $('deleteConfirm').focus();
    return new Promise((resolve) => { deleteResolver = resolve; });
  }

  $('deleteCancel').addEventListener('click', () => closeDeleteModal(false));
  $('deleteConfirm').addEventListener('click', () => closeDeleteModal(true));
  $('deleteModal').addEventListener('click', (event) => {
    if (event.target.matches('[data-delete-cancel]')) closeDeleteModal(false);
  });
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && $('deleteModal').classList.contains('open')) {
      closeDeleteModal(false);
    }
  });

  let sessionLoadVersion = 0;
  async function loadSessions(keepScroll = true) {
    const requestVersion = ++sessionLoadVersion;
    const scroll = listEl.scrollTop;
    try {
      const sessions = await api.list({ query: state.query });
      if (requestVersion !== sessionLoadVersion || state.mode !== 'sessions') return;
      state.sessions = sessions;
      $('countPill').textContent = sessions.length + ' 个会话';
      const fp = JSON.stringify(sessions.map((s) => [s.conversationId, s.sessionId, s.updatedAt, s.instanceCount, s.tools]));
      if (fp !== state.fingerprint) {
        state.fingerprint = fp;
        renderList();
      }
      if (keepScroll) listEl.scrollTop = scroll;
      const selectedCard = state.selectedConversationId && sessions.find((s) => s.conversationId === state.selectedConversationId);
      if (selectedCard) {
        state.selectedId = selectedCard.sessionId;
        if (!sessionInstances(selectedCard).some((fork) => fork.sessionId === state.selectedForkId)) {
          state.selectedForkId = selectedCard.sessionId;
        }
      } else if (state.selectedConversationId) {
        clearDetail();
      }
    } catch (e) {
      if (requestVersion !== sessionLoadVersion) return;
      toast('加载会话失败: ' + (e.message || e), false);
    }
  }

  function renderList() {
    if (!state.sessions.length) {
      listEl.innerHTML = '<div class="empty">没有匹配的会话</div>';
      return;
    }
    const groups = new Map();
    for (const s of state.sessions) {
      const key = projectKey(s.cwd);
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(s);
    }
    if (state.expandedProject && !groups.has(state.expandedProject)) state.expandedProject = null;
    const selectedProject = state.selectedConversationId
      && projectKey((state.sessions.find((s) => s.conversationId === state.selectedConversationId) || {}).cwd);
    let expanded;
    if (state.expandedProject) {
      expanded = state.collapsedProjects.has(state.expandedProject) ? null : state.expandedProject;
    } else {
      expanded = [selectedProject, ...groups.keys()].find((key) => key && !state.collapsedProjects.has(key)) || null;
      state.expandedProject = expanded;
      if (expanded) localStorage.setItem('loomExpandedProject', expanded);
    }
    listEl.innerHTML = [...groups.entries()].map(([cwd, sessions]) => {
      const isOpen = cwd === expanded;
      return [
        '<div class="project' + (isOpen ? ' open' : '') + '" style="--project-accent:' + projectAccent(cwd) + '">',
        '  <div class="project-head" data-project-toggle="' + escapeHtml(cwd) + '" title="' + escapeHtml(cwd) + '">',
        '    <span class="project-name">' + escapeHtml(projectName(cwd)) + '</span>',
        '    <span class="project-count">' + sessions.length + '</span>',
        '  </div>',
        '  <div class="project-sessions"><div class="project-sessions-inner">' + sessions.map((s) => {
          const active = s.conversationId === state.selectedConversationId;
          const forks = sessionInstances(s).map((fork) => [
            '<div class="fork' + (active && state.selectedForkId === fork.sessionId ? ' active' : '') + '"',
            '     data-fork="' + escapeHtml(fork.sessionId) + '" data-id="' + escapeHtml(s.conversationId) + '">',
            '  ' + toolIcon(fork.sourceTool),
            '  <span class="fork-rel" title="' + escapeHtml(fmtTime(fork.updatedAt)) + '">' + relTime(fork.updatedAt) + '</span>',
            '</div>',
          ].join('')).join('\n');
          return [
            '<div class="card' + (active ? ' active' : '') + '" data-id="' + escapeHtml(s.conversationId) + '">',
            '  <div class="title">' + escapeHtml(s.title) + '</div>',
            '  <div class="meta">',
            '    <span class="count">' + s.messageCount + ' 条消息</span>',
            '    <span class="rel" title="' + escapeHtml(fmtTime(s.updatedAt)) + '">' + relTime(s.updatedAt) + '</span>',
            '  </div>',
            '  <div class="forks">' + forks + '</div>',
            '</div>',
          ].join('\n');
        }).join('\n') + '</div></div>',
        '</div>',
      ].join('\n');
    }).join('\n');
    for (const head of listEl.querySelectorAll('.project-head')) {
      head.addEventListener('click', () => {
        const key = head.dataset.projectToggle;
        if (state.expandedProject === key && !state.collapsedProjects.has(key)) {
          state.collapsedProjects.add(key);
        } else {
          state.collapsedProjects.delete(key);
          state.expandedProject = key;
        }
        localStorage.setItem('loomExpandedProject', state.expandedProject || '');
        localStorage.setItem('loomCollapsedProjects', JSON.stringify([...state.collapsedProjects]));
        renderList();
      });
    }
    for (const card of listEl.querySelectorAll('.card')) {
      card.addEventListener('click', () => selectSession(card.dataset.id));
    }
    for (const fork of listEl.querySelectorAll('.fork')) {
      fork.addEventListener('click', (event) => {
        event.stopPropagation();
        selectSession(fork.dataset.id, fork.dataset.fork);
      });
    }
    positionTreeDecorations();
  }

  function clearDetail() {
    state.selectedId = null;
    state.selectedConversationId = null;
    state.selectedForkId = null;
    state.trashSelectedId = null;
    emptyEl.style.display = 'grid';
    bodyEl.classList.remove('open');
    bodyEl.innerHTML = '';
    if (state.mode === 'trash') {
      renderTrashList();
    } else {
      renderList();
    }
  }

  async function selectSession(conversationId, forkId) {
    const card = state.sessions.find((item) => item.conversationId === conversationId);
    if (!card) return;
    state.selectedConversationId = conversationId;
    const instances = sessionInstances(card);
    state.selectedForkId = (forkId && instances.some((fork) => fork.sessionId === forkId))
      ? forkId
      : card.sessionId;
    state.selectedId = state.selectedForkId;
    state.expandedProject = projectKey(card.cwd);
    state.collapsedProjects.delete(state.expandedProject);
    localStorage.setItem('loomExpandedProject', state.expandedProject);
    const inner = listEl.querySelector('.project.open .project-sessions-inner');
    const cardInOpenProject = inner && [...inner.querySelectorAll('.card')]
      .some((node) => node.dataset.id === conversationId);
    if (cardInOpenProject) {
      updateActiveSelection();
    } else {
      renderList();
    }
    let session;
    try {
      session = await api.get(state.selectedForkId);
    } catch (e) {
      toast('读取会话失败: ' + (e.message || e), false);
      return;
    }
    renderDetail(session, card);
  }

  function truncate(s, n) {
    s = String(s == null ? '' : s);
    return s.length > n ? s.slice(0, n) + '\n… (截断, 共 ' + s.length + ' 字符)' : s;
  }

  function sessionTitle(session) {
    const firstUser = session.messages.find((m) => m.role === 'user' && m.text && m.text.trim());
    const t = firstUser ? firstUser.text.trim().replace(/\s+/g, ' ') : '(空会话)';
    return t.length > 120 ? t.slice(0, 120) + '…' : t;
  }

  function renderDetail(session, card) {
    emptyEl.style.display = 'none';
    bodyEl.classList.add('open');
    const instances = sessionInstances(card || session);
    const linkedTools = card && card.tools && card.tools.length ? card.tools : [session.sourceTool];
    const otherTools = Object.keys(TOOL_LABELS).filter((tool) => tool !== session.sourceTool);
    const toolCalls = session.messages.reduce((n, m) => n + ((m.toolCalls && m.toolCalls.length) || 0), 0);
    const title = sessionTitle(session);

    bodyEl.innerHTML = [
      '<div class="detail-head">',
      '  <h1>' + escapeHtml(title) + '</h1>',
      '  <div class="detail-sub">',
      '    <span>' + session.messages.length + ' 条消息 · ' + toolCalls + ' 次工具调用</span>',
      '    <span>更新于 ' + escapeHtml(fmtTime(session.updatedAt)) + '</span>',
      '  </div>',
      '  <div class="detail-sub"><span class="cwd">' + escapeHtml(session.cwd) + '</span></div>',
      '  <div class="detail-sub"><span class="sid" id="sidCopy" title="点击复制会话 ID">' + escapeHtml(session.sessionId) + '</span></div>',
      '  <div class="actions">',
    ].concat(
      otherTools.map((tool, index) => {
        const linked = linkedTools.includes(tool);
        const actionLabel = linked ? '同步到 ' : '恢复到 ';
        const title = linked
          ? '用当前 fork 的内容更新 ' + toolLabel(tool) + ' 中的关联会话'
          : '以当前 fork 的内容在 ' + toolLabel(tool) + ' 中继续对话';
        return '    <button class="btn' + (index === 0 ? ' primary' : '') + '" id="btnRestore-' + tool + '" title="' + title + '">' + toolIcon(tool) + '<span>' + actionLabel + toolLabel(tool) + '</span></button>';
      }),
      [
        '    <button class="btn danger" id="btnDelete"><span class="icon-glyph">' + TRASH_ICON + '</span><span>删除当前 fork</span></button>',
        ...(instances.length > 1 ? ['    <button class="btn danger-outline" id="btnDeleteAll"><span class="icon-glyph">' + TRASH_ICON + '</span><span>删除整个会话（含全部 fork）</span></button>'] : []),
        '  </div>',
        '</div>',
        '<div id="conversation"></div>',
      ]
    ).join('\n');

    $('sidCopy').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(session.sessionId);
        toast('会话 ID 已复制');
      } catch {
        const ta = document.createElement('textarea');
        ta.value = session.sessionId;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        toast('会话 ID 已复制');
      }
    });

    for (const tool of otherTools) {
      const button = $('btnRestore-' + tool);
      if (!button) continue;
      const action = linkedTools.includes(tool) ? 'sync' : 'restore';
      button.addEventListener('click', (event) => doTransfer(session.sessionId, tool, event.currentTarget, action));
    }
    $('btnDelete').addEventListener('click', async (event) => {
      const trigger = event.currentTarget;
      if (!await confirmDelete(session, title, trigger)) return;
      trigger.disabled = true;
      try {
        const res = await api.remove(session.sessionId);
        toast(res.message, res.ok);
        if (res.ok) {
          state.fingerprint = '';
          await loadSessions(false);
          if (state.sessions.some((s) => s.conversationId === card.conversationId)) {
            await selectSession(card.conversationId);
          } else {
            clearDetail();
          }
        }
      } catch (e) {
        toast('删除失败: ' + (e.message || e), false);
      } finally {
        trigger.disabled = false;
      }
    });
    if (instances.length > 1) {
      $('btnDeleteAll').addEventListener('click', async (event) => {
        const trigger = event.currentTarget;
        if (!await confirmDelete(session, title + '（含全部 fork）', trigger)) return;
        trigger.disabled = true;
        try {
          let failure = null;
          for (const fork of instances) {
            const res = await api.remove(fork.sessionId);
            if (!res.ok) { failure = res.message; break; }
          }
          if (failure) {
            toast('删除失败: ' + failure, false);
          } else {
            toast('会话及全部 fork 已删除');
            state.fingerprint = '';
            clearDetail();
            await loadSessions(false);
          }
        } catch (e) {
          toast('删除失败: ' + (e.message || e), false);
        } finally {
          trigger.disabled = false;
        }
      });
    }

    renderConversation(session);
  }

  function renderConversation(session) {
    const conv = $('conversation');
    const frag = document.createDocumentFragment();
    for (const m of session.messages) {
      const hasText = m.text && m.text.trim();
      const hasTools = m.toolCalls && m.toolCalls.length;
      if (!hasText && !hasTools) continue;
      const div = document.createElement('div');
      div.className = 'msg ' + m.role;
      let html = '<div class="role">' + (m.role === 'user' ? '用户' : '助手') + '</div>';
      if (hasText) html += '<div class="text">' + escapeHtml(m.text) + '</div>';
      for (const tc of m.toolCalls || []) {
        html += '<details class="tool"><summary>' + escapeHtml(tc.name) + '</summary>';
        html += '<pre>' + escapeHtml(truncate(JSON.stringify(tc.input, null, 2) || '', 4000)) + '</pre>';
        if (tc.output) html += '<pre>' + escapeHtml(truncate(tc.output, 4000)) + '</pre>';
        html += '</details>';
      }
      div.innerHTML = html;
      frag.appendChild(div);
    }
    conv.innerHTML = '';
    conv.appendChild(frag);
    if (!conv.children.length) {
      conv.innerHTML = '<div class="empty">这个会话没有可显示的对话内容</div>';
    }
  }

  async function doTransfer(sessionId, target, btn, action) {
    const transfer = TRANSFER_ACTIONS[action];
    btn.disabled = true;
    const old = btn.textContent;
    btn.textContent = transfer.pending;
    try {
      const res = await transfer.run(sessionId, target);
      toast(res.message, res.ok);
      if (res.ok) {
        const conversationId = state.selectedConversationId;
        state.fingerprint = '';
        await loadSessions(false);
        if (conversationId && state.sessions.some((session) => session.conversationId === conversationId)) {
          await selectSession(conversationId, state.selectedForkId);
        }
      }
    } catch (e) {
      toast(transfer.failure + (e.message || e), false);
    } finally {
      btn.disabled = false;
      btn.textContent = old;
    }
  }

  let trashLoadVersion = 0;
  async function loadTrash(keepScroll = true) {
    const requestVersion = ++trashLoadVersion;
    const scroll = listEl.scrollTop;
    try {
      const entries = await api.trashList();
      if (requestVersion !== trashLoadVersion || state.mode !== 'trash') return;
      state.trash = entries;
      $('trashNote').textContent = entries.length
        ? '回收站 · ' + entries.length + ' 项 · 删除后 30 天内可恢复'
        : '回收站是空的';
      $('countPill').textContent = entries.length + ' 个回收站条目';
      const fp = JSON.stringify(entries.map((e) => e.session.sessionId + e.deletedAt));
      if (fp !== state.trashFingerprint) {
        state.trashFingerprint = fp;
        renderTrashList();
      }
      if (keepScroll) listEl.scrollTop = scroll;
      if (state.trashSelectedId && !entries.some((e) => e.session.sessionId === state.trashSelectedId)) {
        clearDetail();
      }
    } catch (e) {
      if (requestVersion !== trashLoadVersion) return;
      toast('加载回收站失败: ' + (e.message || e), false);
    }
  }

  function renderTrashList() {
    if (!state.trash.length) {
      listEl.innerHTML = '<div class="empty">回收站是空的</div>';
      return;
    }
    listEl.innerHTML = state.trash.map((entry) => {
      const s = entry.session;
      const active = s.sessionId === state.trashSelectedId ? ' active' : '';
      return [
        '<div class="card' + active + '" data-id="' + escapeHtml(s.sessionId) + '">',
        '  <div class="title">' + escapeHtml(sessionTitle(s)) + '</div>',
        '  <div class="meta">',
        '    ' + toolIcon(s.sourceTool),
        '    <span class="count">' + s.messages.length + ' 条消息</span>',
        '    <span class="rel" title="' + escapeHtml(fmtTime(entry.deletedAt)) + '">删除于 ' + relTime(entry.deletedAt) + '</span>',
        '  </div>',
        '  <div class="cwd" title="' + escapeHtml(s.cwd) + '">' + escapeHtml(s.cwd) + '</div>',
        '</div>',
      ].join('\n');
    }).join('\n');
    for (const card of listEl.querySelectorAll('.card')) {
      card.addEventListener('click', () => selectTrashEntry(card.dataset.id));
    }
  }

  async function selectTrashEntry(id) {
    state.trashSelectedId = id;
    renderTrashList();
    const entry = state.trash.find((e) => e.session.sessionId === id);
    if (entry) renderTrashDetail(entry);
  }

  function renderTrashDetail(entry) {
    const session = entry.session;
    emptyEl.style.display = 'none';
    bodyEl.classList.add('open');
    const toolCalls = session.messages.reduce((n, m) => n + ((m.toolCalls && m.toolCalls.length) || 0), 0);
    const title = sessionTitle(session);

    bodyEl.innerHTML = [
      '<div class="detail-head">',
      '  <h1>' + escapeHtml(title) + '</h1>',
      '  <div class="detail-sub">',
      '    ' + toolIcon(session.sourceTool),
      '    <span>' + session.messages.length + ' 条消息 · ' + toolCalls + ' 次工具调用</span>',
      '    <span>删除于 ' + escapeHtml(fmtTime(entry.deletedAt)) + '</span>',
      '  </div>',
      '  <div class="detail-sub"><span class="cwd">' + escapeHtml(session.cwd) + '</span></div>',
      '  <div class="actions">',
      '    <button class="btn primary" id="btnTrashRestore">恢复到会话列表</button>',
      '    <button class="btn danger" id="btnTrashDelete">彻底删除</button>',
      '    <button class="btn" id="btnTrashBack">← 返回回收站</button>',
      '  </div>',
      '</div>',
      '<div id="conversation"></div>',
    ].join('\n');

    $('btnTrashRestore').addEventListener('click', async (e) => {
      e.target.disabled = true;
      try {
        await api.trashRestore(session.sessionId);
        toast('已恢复到会话列表');
        state.trashFingerprint = '';
        clearDetail();
        loadTrash(false);
      } catch (err) {
        toast('恢复失败: ' + (err.message || err), false);
        e.target.disabled = false;
      }
    });
    $('btnTrashDelete').addEventListener('click', async (e) => {
      const trigger = e.currentTarget;
      if (!await confirmDelete(session, title, trigger, true)) return;
      trigger.disabled = true;
      try {
        await api.trashRemove(session.sessionId);
        toast('已彻底删除');
        state.trashFingerprint = '';
        clearDetail();
        loadTrash(false);
      } catch (err) {
        toast('删除失败: ' + (err.message || err), false);
        e.target.disabled = false;
      }
    });
    $('btnTrashBack').addEventListener('click', () => clearDetail());

    renderConversation(session);
  }

  function enterTrashMode() {
    state.mode = 'trash';
    $('sessionTools').classList.add('hidden');
    $('trashTools').classList.add('active');
    $('openTrash').style.display = 'none';
    clearDetail();
    state.trashFingerprint = '';
    loadTrash(false);
  }

  function exitTrashMode() {
    state.mode = 'sessions';
    $('trashTools').classList.remove('active');
    $('sessionTools').classList.remove('hidden');
    $('openTrash').style.display = '';
    clearDetail();
    state.fingerprint = '';
    loadSessions(false);
  }

  $('openTrash').addEventListener('click', enterTrashMode);
  $('closeTrash').addEventListener('click', exitTrashMode);
  $('githubLink').addEventListener('click', (event) => {
    event.preventDefault();
    api.openGithub().catch((error) => toast('打开 GitHub 失败: ' + (error.message || error), false));
  });

  // The window close button hides to the tray. Reset transient views so the
  // next open always lands on the session list instead of the recycle bin.
  window.__TAURI__.event.listen('window-hidden', () => {
    if (state.mode === 'trash') exitTrashMode();
    daemonBall?.setActive(false);
  }).catch(() => {});
  window.__TAURI__.event.listen('window-shown', () => {
    if (state.mode === 'trash') exitTrashMode();
    daemonBall?.setActive(true);
  }).catch(() => {});

  function setDaemonBallEmotion(id) {
    if (daemonBall && daemonBall.emotionId !== id) daemonBall.setEmotion(id, { auto: true });
  }

  async function refreshDaemon() {
    try {
      const s = await api.daemonStatus();
      $('daemonPill').classList.toggle('on', !!s.running);
      $('daemonText').textContent = s.running ? '守护进程 · 运行中 (pid ' + s.pid + ')' : '守护进程 · 已停止';
      setDaemonBallEmotion(s.running ? '02' : '00');
    } catch {
      $('daemonPill').classList.remove('on');
      $('daemonText').textContent = '守护进程 · 未知';
      setDaemonBallEmotion('34');
    }
  }

  $('daemonPill').addEventListener('click', async () => {
    try {
      await api.daemonToggle();
      await refreshDaemon();
    } catch (e) {
      toast('守护进程操作失败: ' + (e.message || e), false);
    }
  });

  let pendingUpdate = null;
  let updateCheckInFlight = false;
  let updateInstallInFlight = false;

  function updateErrorMessage(error) {
    return error?.message || String(error);
  }

  async function closePendingUpdate() {
    if (!pendingUpdate?.close) return;
    try {
      await pendingUpdate.close();
    } catch {
      // Closing an updater resource is best effort.
    }
  }

  async function checkForUpdate() {
    if (!updater?.check || updateCheckInFlight || updateInstallInFlight) return;
    updateCheckInFlight = true;
    try {
      const update = await updater.check();
      if (!update) {
        await closePendingUpdate();
        pendingUpdate = null;
        $('updatePill').hidden = true;
        return;
      }

      if (pendingUpdate && pendingUpdate !== update) await closePendingUpdate();
      pendingUpdate = update;
      const version = update.version || '新版本';
      $('updatePill').textContent = '更新 · v' + version;
      $('updatePill').title = update.body ? '查看更新说明并安装' : '下载并安装 v' + version;
      $('updatePill').hidden = false;
      toast('发现 Session-Loom 新版本 v' + version + '，点击右上角更新');
    } catch {
      // Update checks are optional; an unavailable endpoint must not affect the app.
    } finally {
      updateCheckInFlight = false;
    }
  }

  async function installUpdate() {
    if (!pendingUpdate || updateInstallInFlight) return;
    const version = pendingUpdate.version || '新版本';
    const notes = pendingUpdate.body?.trim();
    const summary = notes ? '\\n\\n更新说明：\\n' + notes.slice(0, 800) : '';
    if (!window.confirm('发现 Session-Loom v' + version + '。现在下载并安装吗？' + summary)) return;

    updateInstallInFlight = true;
    const button = $('updatePill');
    button.disabled = true;
    button.textContent = '正在下载…';
    let downloaded = 0;
    let contentLength = 0;
    try {
      await pendingUpdate.downloadAndInstall((event) => {
        if (event.event === 'Started') {
          contentLength = event.data?.contentLength || 0;
        } else if (event.event === 'Progress') {
          downloaded += event.data?.chunkLength || 0;
          const percent = contentLength ? Math.floor(downloaded / contentLength * 100) : 0;
          button.textContent = percent ? '更新 · ' + percent + '%' : '正在下载…';
        }
      });
      button.textContent = '正在重启…';
      if (!processApi?.relaunch) throw new Error('重启 API 不可用');
      await processApi.relaunch();
    } catch (error) {
      button.disabled = false;
      button.textContent = '更新 · v' + version;
      toast('更新失败: ' + updateErrorMessage(error), false);
    } finally {
      updateInstallInFlight = false;
    }
  }

  $('updatePill').addEventListener('click', installUpdate);

  let searchTimer;
  $('search').addEventListener('input', (e) => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      state.query = e.target.value;
      state.fingerprint = '';
      loadSessions(false);
    }, 220);
  });

  setInterval(() => {
    if (!document.hidden) {
      if (state.mode === 'trash') {
        loadTrash();
      } else {
        loadSessions();
      }
      refreshDaemon();
    }
  }, 3000);

  loadSessions(false);
  refreshDaemon();
  // Checking is intentionally delayed so the first view is responsive even
  // when the release endpoint is slow or unavailable.
  setTimeout(checkForUpdate, 1500);
  setInterval(checkForUpdate, 6 * 60 * 60 * 1000);
</script>
</body>
</html>
