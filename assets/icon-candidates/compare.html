<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Session-Loom 图标候选</title>
<style>
  body { font: 14px/1.6 'Segoe UI Variable Text', 'Segoe UI', 'Microsoft YaHei UI', sans-serif; background: #F6F4EF; color: #24231F; padding: 32px; }
  h1 { font-size: 18px; margin-bottom: 4px; }
  .hint { color: #6E6A60; font-size: 12.5px; margin-bottom: 28px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
  .item { background: #FFF; border: 1px solid rgba(31,30,27,.1); border-radius: 14px; padding: 18px; text-align: center; }
  .item h2 { font-size: 14px; font-weight: 650; margin-bottom: 2px; }
  .item .sub { font-size: 11.5px; color: #A8A394; margin-bottom: 14px; }
  .item img.big { width: 128px; height: 128px; border-radius: 26px; display: block; margin: 0 auto 14px; box-shadow: 0 6px 18px rgba(31,30,27,.18); }
  .sizes { display: flex; align-items: flex-end; justify-content: center; gap: 14px; padding: 10px 0 2px; border-top: 1px dashed rgba(31,30,27,.12); }
  .sizes figure { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .sizes img { display: block; border-radius: 22%; }
  .sizes figcaption { font-size: 10px; color: #A8A394; font-family: Consolas, monospace; }
  .on-dark { background: #2A1E17; border-radius: 8px; padding: 6px; }
</style>
</head>
<body>
  <h1>Session-Loom 图标候选</h1>
  <div class="hint">每个图标展示了 128px 大图，以及 48 / 32 / 16px 缩略（浅色底 + 深色底）。小尺寸下的辨识度最重要。</div>
  <div class="grid">
    <div class="item">
      <h2>01 · 绳结</h2>
      <div class="sub">双缎带交织成 S 结</div>
      <img class="big" src="01-knot.png" alt="knot" />
      <div class="sizes">
        <figure><img src="01-knot.png" width="48" height="48" /><figcaption>48</figcaption></figure>
        <figure><img src="01-knot.png" width="32" height="32" /><figcaption>32</figcaption></figure>
        <figure><img src="01-knot.png" width="16" height="16" /><figcaption>16</figcaption></figure>
        <figure class="on-dark"><img src="01-knot.png" width="32" height="32" /><figcaption style="color:#8a7f72">深底</figcaption></figure>
      </div>
    </div>
    <div class="item">
      <h2>02 · 气泡</h2>
      <div class="sub">两个对话气泡编织交叠</div>
      <img class="big" src="02-bubbles.png" alt="bubbles" />
      <div class="sizes">
        <figure><img src="02-bubbles.png" width="48" height="48" /><figcaption>48</figcaption></figure>
        <figure><img src="02-bubbles.png" width="32" height="32" /><figcaption>32</figcaption></figure>
        <figure><img src="02-bubbles.png" width="16" height="16" /><figcaption>16</figcaption></figure>
        <figure class="on-dark"><img src="02-bubbles.png" width="32" height="32" /><figcaption style="color:#8a7f72">深底</figcaption></figure>
      </div>
    </div>
    <div class="item">
      <h2>03 · 织样</h2>
      <div class="sub">经纬线平纹编织方块</div>
      <img class="big" src="03-weave.png" alt="weave" />
      <div class="sizes">
        <figure><img src="03-weave.png" width="48" height="48" /><figcaption>48</figcaption></figure>
        <figure><img src="03-weave.png" width="32" height="32" /><figcaption>32</figcaption></figure>
        <figure><img src="03-weave.png" width="16" height="16" /><figcaption>16</figcaption></figure>
        <figure class="on-dark"><img src="03-weave.png" width="32" height="32" /><figcaption style="color:#8a7f72">深底</figcaption></figure>
      </div>
    </div>
    <div class="item">
      <h2>04 · 无限环</h2>
      <div class="sub">双股线编成 ∞ 环</div>
      <img class="big" src="04-loop.png" alt="loop" />
      <div class="sizes">
        <figure><img src="04-loop.png" width="48" height="48" /><figcaption>48</figcaption></figure>
        <figure><img src="04-loop.png" width="32" height="32" /><figcaption>32</figcaption></figure>
        <figure><img src="04-loop.png" width="16" height="16" /><figcaption>16</figcaption></figure>
        <figure class="on-dark"><img src="04-loop.png" width="32" height="32" /><figcaption style="color:#8a7f72">深底</figcaption></figure>
      </div>
    </div>
  </div>
</body>
</html>
